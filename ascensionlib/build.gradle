plugins {
    id 'fabric-loom'
    // Enables Loom's Kotlin metadata remapper for Cobblemon's reflective serializers.
    id 'org.jetbrains.kotlin.jvm'
}
base { archivesName = 'AscensionLib' }
loom {
    // Generates the mixin refmap. Without it the injections that target Minecraft-named methods (render, mouseClicked, init)
    // are written with Mojang names, which exist only in a development run: in a normal install they cannot be found.
    mixin { useLegacyMixinAp = true }
    mods {
        register('ascensionlib') {
            sourceSet sourceSets.main
        }
    }
}
configurations { serverSimulatorRuntime }
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'maven.modrinth:MdwFAVRL:GJ2a1b8O'
    // WebGUI (github.com/mc-webgui/webgui, MIT) shows the server's pages on each client. Optional at runtime, so compile against it only;
    // download its v2.0.0 jar and run tools/prepare_webgui_dev_jar.py (see libs/README.md). The dev server loads it too.
    modCompileOnly files('libs/webgui-dev.jar')
    modLocalRuntime files('libs/webgui-dev.jar')
    // Polymer (github.com/Patbox/polymer, LGPL) hosts the server resource pack. Optional at runtime: when it is installed the mod adds its item
    // art to the pack itself (PolymerPack); without it the mod runs unchanged. Compile against the two jars only (libs/README.md).
    modCompileOnly files('libs/polymer-resource-pack-0.9.19+1.21.1.jar', 'libs/polymer-common-0.9.19+1.21.1.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    // Loom's dev-remapped dependency omits the upstream nested jars. Production Cobblemon
    // supplies these; declare them explicitly only for the development runtime.
    modRuntimeOnly 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
    runtimeOnly 'org.graalvm.js:js:22.3.0'
    // Minecraft declares ICU as client-only, so Loom removes it from runServer's classpath.
    // The server-side simulator still needs Cobblemon's bundled version.
    serverSimulatorRuntime 'com.ibm.icu:icu4j:71.1'
    runtimeOnly 'org.mongodb:mongodb-driver-sync:4.10.2'
    implementation project(':domain')
    include project(':domain')
    implementation project(':store')
    include project(':store')
    // Loom includes only the named artifact, so the pinned JDBC driver is nested explicitly.
    include 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.named('runServer') { classpath += configurations.serverSimulatorRuntime }
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
    // The item art (models and textures) rides in the jar so Polymer can add it to the server pack. It sits under its own folder, not
    // under assets/, so it is not also loaded as the mod's own client resources; stray archives in the folder are left out.
    from(rootProject.file('resourcepack/assets/ascensionlib')) {
        include 'models/**', 'textures/**', 'sounds.json', 'sounds/**'
        into 'ascensionlib-pack/assets/ascensionlib'
    }
    // The World Boss bar's sprites replace vanilla's, so they live in the minecraft namespace (see tools/bossbar_art.py).
    from(rootProject.file('resourcepack/assets/minecraft/textures')) {
        include 'gui/sprites/boss_bar/**'
        into 'ascensionlib-pack/assets/minecraft/textures'
    }
}
