<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet</title>
<link rel="stylesheet" href="ascension.css">
<style>
  .frame { width: 760px; height: 560px; }
  .main { flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>WALLET</span><button class="x" id="close" title="Close">X</button></div>
  <div class="main" id="main"></div>
  <div class="foot">
    <div class="msg muted" id="free"></div>
    <button class="primary" id="depositAll">Deposit all vouchers</button>
    <button id="done">Close</button>
  </div>
</div>
<script src="ui.js"></script>
<script src="wallet-panel.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  // The panel draws the balances; this page only owns its footer.
  var panel = A.wallet.mount($('main'), {
    onView: function (view) {
      A.text($('free'), view.freeSlots + ' free inventory slot' + (view.freeSlots === 1 ? '' : 's') + ' (64 units per slot)');
      $('depositAll').disabled = !view.lines.some(function (l) { return l.carried > 0; });
    }
  });
  $('close').addEventListener('click', function () { A.send('close'); });
  $('done').addEventListener('click', function () { A.send('close'); });
  $('depositAll').addEventListener('click', function () { panel.depositAll(); });
  A.setBezel('');
  if (!A.g) A.text($('free'), 'This page needs the WebGUI mod.'); else panel.refresh();
})();
</script>
</body>
</html>
