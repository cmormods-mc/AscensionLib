<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifiers</title>
<link rel="stylesheet" href="ascension.css">
<style>
  .top { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 2px solid var(--line); }
  .top .nm { font-size: 16px; text-shadow: var(--glow); }
  .grade { display: inline-block; padding: 1px 8px; font-size: 11px; letter-spacing: .1em; color: #fff; background: #293547; border: 2px solid var(--outline); }
  .pend { margin-left: auto; text-align: right; } .pend b { font-size: 26px; line-height: 1; color: var(--acc); text-shadow: var(--glow); }
  .stage { width: 108px; height: 72px; }
  .sprbox { display: flex; align-items: center; justify-content: center; }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 132px; gap: 12px; padding: 10px 14px; }
  .work { min-height: 0; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 4px; align-items: flex-end; }
  .tab { padding: 5px 12px; background: var(--head); border: 2px solid var(--line); border-bottom: 0; cursor: pointer; color: var(--muted); box-shadow: none; text-shadow: none; }
  .tab.on { background: var(--panel); color: var(--ink); border-top: 4px solid var(--acc); text-shadow: var(--glow); }
  .banner { margin-left: 8px; padding: 3px 10px; flex: 1; font-size: 11px; border-left: 4px solid var(--line); background: var(--row); }
  .banner.ok { border-color: var(--good); background: #0d2a1c; color: var(--ink); } .banner.bad { border-color: var(--warn); background: #2b1612; color: var(--ink); }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px 1fr; gap: 8px; }
  .list { overflow-y: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 2px solid transparent; margin-bottom: 3px; cursor: pointer; background: var(--row); }
  .row:hover { border-color: var(--line); } .row.sel { border-color: var(--acc); box-shadow: var(--glow); }
  .row .ic { width: 18px; height: 18px; flex: none; border: 2px solid var(--outline); }
  .row .t1 { font-size: 12px; } .row .t2 { font-size: 10px; color: var(--muted); } .row .v { margin-left: auto; color: var(--acc); text-shadow: var(--glow); }
  .row.off .t1 { color: var(--muted); }
  .pair { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
  .vbox { flex: 1; padding: 8px; background: var(--row); border: 2px solid var(--line); text-align: center; }
  .vbox.next { border-color: var(--acc); box-shadow: var(--glow); } .vbox .big { font-size: 20px; color: var(--acc); text-shadow: var(--glow); } .vbox .sm { font-size: 10px; color: var(--muted); }
  .cost { margin-top: auto; border-top: 2px solid var(--line); padding-top: 8px; display: flex; align-items: center; gap: 10px; }
  .cost .c { flex: 1; }
  .wallet .coin { display: flex; align-items: center; gap: 8px; padding: 5px 2px; border-bottom: 1px solid var(--line); }
  .wallet .dot { width: 24px; height: 24px; flex: none; }   /* a smooth downscale of the 32px art: 24 is not a whole fraction of 32 */
  .meter { height: 10px; background: var(--well); border: 2px solid var(--line); } .meter i { display: block; height: 100%; background: var(--acc); box-shadow: var(--glow); }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>MODIFIERS</span><button class="x" id="close" title="Close">&times;</button></div>
  <div class="top">
    <div id="art" class="stage"></div>
    <div><div class="nm" id="name"></div><div><span class="muted" id="lvl"></span> <span class="grade" id="grade"></span></div></div>
    <div class="pend"><b id="pend">0</b><div class="muted" id="pendLabel"></div></div>
  </div>
  <div class="body">
    <div class="work">
      <div class="tabs" id="tabs"></div>
      <div class="split">
        <div class="box list" id="list"></div>
        <div class="box" id="detail"></div>
      </div>
    </div>
    <div class="box wallet" id="wallet"><div class="label">Wallet</div></div>
  </div>
  <div class="foot">
    <div class="msg muted" id="next"></div>
    <button id="bank">Wallet</button>
    <button id="fuse" style="display:none">Fuse</button>
    <button id="later">Decide later</button>
  </div>
</div>

<div class="scrim" id="scrim"><div class="dialog">
  <h3 id="dTitle"></h3><div id="dBody"></div>
  <div class="row"><button id="dCancel">Cancel</button><button class="primary" id="dOk">Confirm</button></div>
</div></div>

<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var MODES = ['upgrade', 'refine', 'reforge', 'perfect', 'overreach', 'promote', 'unique', 'respec'];
  var view = null, mode = 'upgrade', slotId = '', uniqueId = '', phase = 'browse', pendingOp = '', banner = '', bannerOk = false, waitTimer = 0, tries = 0, action = '';   // action: what the open dialog confirms when it is not simply the tab's own: 'prism' or 'buy'

  function slot() { for (var i = 0; i < view.slots.length; i++) if (view.slots[i].slotId === slotId) return view.slots[i]; return null; }
  function blockFor(s) {
    if (mode === 'promote') return view.promotion.block;
    if (mode === 'unique') return view.unique.block;
    if (mode === 'respec') return view.respec.hourglassBlock;
    return !s ? '' : mode === 'upgrade' ? s.upgradeBlock : mode === 'refine' ? s.refineBlock : mode === 'perfect' ? s.perfectBlock : mode === 'overreach' ? s.overreachBlock : s.reforgeBlock;
  }
  function validUnique(wanted) {
    var o = view.unique.options;
    for (var i = 0; i < o.length; i++) if (o[i].id === wanted) return wanted;
    for (i = 0; i < o.length; i++) if (o[i].current) return o[i].id;
    return o.length ? o[0].id : '';
  }
  function uniqueOpt() { var o = view.unique.options; for (var i = 0; i < o.length; i++) if (o[i].id === uniqueId) return o[i]; return null; }
  function uniqueReady() { return !!uniqueId && !view.unique.block && uniqueId !== view.unique.currentId; }
  function shortPrice(p) {
    var parts = [];
    if (p.dust > 0) parts.push(p.dust + ' Dust');
    if (p.facets > 0) parts.push(p.facets + (p.facets === 1 ? ' Facet' : ' Facets'));
    if (p.cores > 0) parts.push(p.cores + (p.cores === 1 ? ' Core' : ' Cores'));
    return parts.length ? parts.join(' + ') : 'Free';
  }
  function costText() {
    switch (mode) {
      case 'upgrade': return '1 pending upgrade (you have ' + view.pending + ')';
      case 'refine': return shortPrice(view.refine);
      case 'reforge': return shortPrice(view.reforge);
      case 'perfect': { var ps = slot(); return ps ? ps.perfectCost + ' Resonance Dust (you have ' + view.dust + ')' : '—'; }
      case 'overreach': { var os = slot(); return os ? os.overreachDust + ' Resonance Dust + ' + os.overreachFacets + ' Facets + 1 Tower Mark (you have ' + view.dust + ' / ' + view.facets + ' / ' + view.marks + ')' : '—'; }
      case 'promote': return shortPrice(view.promotion.price);
      case 'respec': return '1 Hourglass of Undoing (you have ' + view.respec.hourglasses + ')';
      default: return '1 Unique Catalyst + 1 Tower Mark (you have ' + view.unique.catalysts + ' / ' + view.marks + ')';
    }
  }
  function shortCost() { var ps = slot(); return mode === 'upgrade' ? '1 upgrade' : mode === 'respec' ? '1 Hourglass' : mode === 'unique' ? '1 Catalyst + 1 Mark' : mode === 'perfect' ? (ps ? ps.perfectCost + ' Dust' : '—') : mode === 'overreach' ? (ps ? ps.overreachDust + ' Dust + ' + ps.overreachFacets + ' Facets + 1 Mark' : '—') : costText(); }
  function canReview() {
    var s = slot();
    if (mode === 'promote') return !view.promotion.block && !!view.promotion.toRarity;
    if (mode === 'unique') return uniqueReady();
    if (mode === 'respec') return !view.respec.hourglassBlock;
    return !!s && !blockFor(s);
  }

  function drawTabs() {
    var box = $('tabs'); box.innerHTML = '';
    MODES.forEach(function (m) {
      var t = A.el('button', 'tab' + (m === mode ? ' on' : ''), A.cap(m));
      t.addEventListener('click', function () { if (phase !== 'browse') return; mode = m; banner = ''; render(); });
      box.appendChild(t);
    });
    var b = A.el('div', 'banner' + (banner ? (bannerOk ? ' ok' : ' bad') : ''), banner);
    if (!banner) b.style.visibility = 'hidden';
    box.appendChild(b);
  }

  function drawList() {
    var box = $('list'); box.innerHTML = '';
    if (mode === 'respec') {
      box.appendChild(A.el('div', 'row muted', 'A Rank Respec resets all of these.'));
      view.respec.resets.forEach(function (r) {
        var row = A.el('div', 'row');
        row.appendChild(A.affixIcon(r.name, false));
        var col = A.el('div'); col.appendChild(A.el('div', 't1', r.name));
        col.appendChild(A.el('div', 't2', 'rank ' + A.roman[Math.max(1, Math.min(5, r.rank))] + ' → I' + (r.floor > 0 ? ' · floor +' + r.floor + '% cleared' : ''))); row.appendChild(col);
        box.appendChild(row);
      });
      return;
    }
    if (mode === 'unique') {
      view.unique.options.forEach(function (o) {
        var r = A.el('div', 'row uopt' + (o.id === uniqueId ? ' sel' : ''));
        r.appendChild(A.affixIcon(o.name, true));
        r.appendChild(A.el('div', 't1', o.name));
        if (o.current) { var h = A.el('div', 'v bad', 'held'); r.appendChild(h); }
        r.addEventListener('click', function () { uniqueId = o.id; render(); });
        box.appendChild(r);
      });
      return;
    }
    if (mode === 'promote') {
      box.appendChild(A.el('div', 'row', 'Promotion applies to the whole Pokémon.'));
    }
    if (!view.slots.length) box.appendChild(A.el('div', 'row muted', 'No affixes to change.'));
    view.slots.forEach(function (s) {
      var prefix = s.category === 'prefix';
      var r = A.el('div', 'row' + (s.slotId === slotId ? ' sel' : '') + (mode !== 'promote' && blockFor(s) ? ' off' : ''));
      r.appendChild(A.affixIcon(s.name, false));
      var col = A.el('div'); col.appendChild(A.el('div', 't1', s.name));
      col.appendChild(A.el('div', 't2', (prefix ? 'Offense' : 'Defense') + ' · ' + A.roman[Math.max(1, Math.min(5, s.rank))] + (s.sealed ? ' · sealed' : ''))); r.appendChild(col);
      r.appendChild(A.el('div', 'v', '+' + s.value + '%'));
      r.addEventListener('click', function () { slotId = s.slotId; render(); });
      box.appendChild(r);
    });
  }

  function vbox(label, big, small, next) {
    var b = A.el('div', 'vbox' + (next ? ' next' : ''));
    b.appendChild(A.el('div', 'muted', label)); b.appendChild(A.el('div', 'big', big)); b.appendChild(A.el('div', 'sm', small));
    return b;
  }
  function pair(box, left, right) {
    var p = A.el('div', 'pair'); p.appendChild(left); p.appendChild(A.el('div', 'muted', '→')); p.appendChild(right); box.appendChild(p);
  }
  function costRow(box, reason, onReview) {
    var c = A.el('div', 'cost');
    var col = A.el('div', 'c'); col.appendChild(A.el('div', 'muted', 'Cost'));
    col.appendChild(A.el('div', reason ? 'bad' : '', reason || shortCost())); c.appendChild(col);
    var rb = A.el('button', 'primary', 'Review'); rb.disabled = !canReview();
    rb.addEventListener('click', function () { action = ''; phase = 'review'; render(); });
    c.appendChild(rb); box.appendChild(c);
  }

  function drawDetail() {
    var box = $('detail'); box.innerHTML = '';
    if (mode === 'promote') {
      var p = view.promotion;
      box.appendChild(A.el('div', 'label', 'Promote'));
      if (!p.toRarity) { box.appendChild(A.el('div', '', 'Already the highest rarity.')); return; }
      box.appendChild(A.el('div', '', A.rarityName(view.rarityId) + ' → ' + A.rarityName(p.toRarity)));
      pair(box, vbox('Now', A.rarityName(view.rarityId), 'keeps all modifiers', false), vbox('Promote to', A.rarityName(p.toRarity), '+1 modifier slot', true));
      box.appendChild(A.el('div', '', 'Attunement ' + p.attunement + ' / ' + p.attunementNeeded));
      var m = A.el('div', 'meter'); var f = A.el('i'); f.style.width = (p.attunementNeeded <= 0 ? 100 : Math.min(100, 100 * p.attunement / p.attunementNeeded)) + '%'; m.appendChild(f); box.appendChild(m);
      box.appendChild(A.el('div', 'muted', 'Attunement grows when this Pokémon is in your party for a Tower boss clear.'));
      box.appendChild(A.el('div', 'spacer')); costRow(box, p.block); return;
    }
    if (mode === 'respec') {
      var rs = view.respec;
      box.appendChild(A.el('div', 'label', 'Hourglass of Undoing'));
      box.appendChild(A.el('div', '', 'Every modifier goes back to rank I, its perfected floor is cleared, and all ' + rs.spent + (rs.spent === 1 ? ' upgrade credit comes' : ' upgrade credits come') + ' back to spend again.'));
      pair(box, vbox('Now', rs.spent + ' spent', rs.resets.length + ' modifiers', false), vbox('After', '0 spent', rs.spent + ' to spend again', true));
      box.appendChild(A.el('div', 'muted', 'Kept: the affixes themselves, the Unique, the rarity and attunement. Not returned: any dust or facets already spent. A Pokémon that has Overreached is sealed for good and can never be respecced.'));
      var held = A.el('div', 'cost');
      held.appendChild(A.el('div', 'c muted', 'You hold ' + rs.hourglasses + (rs.hourglasses === 1 ? ' Hourglass' : ' Hourglasses') + ' · ' + rs.marks + ' Tower Marks'));
      var buy = A.el('button', '', 'Buy for ' + rs.price + ' Marks');
      buy.disabled = rs.marks < rs.price || phase !== 'browse'; buy.title = rs.marks < rs.price ? 'Needs ' + rs.price + ' Tower Marks (about 20 hours of Tower play).' : 'Trades ' + rs.price + ' Tower Marks for one Hourglass of Undoing.';
      buy.addEventListener('click', function () { if (phase === 'browse') { action = 'buy'; phase = 'review'; render(); } });
      held.appendChild(buy); box.appendChild(held);
      box.appendChild(A.el('div', 'spacer')); costRow(box, rs.hourglassBlock); return;
    }
    if (mode === 'unique') {
      var o = uniqueOpt();
      if (!o) { box.appendChild(A.el('div', 'muted', 'No Unique powers are on offer.')); return; }
      box.appendChild(A.el('div', 'label', o.current ? o.name + ' (held)' : o.name));
      box.appendChild(A.el('div', 'muted', 'Benefit')); box.appendChild(A.el('div', '', o.benefit));
      box.appendChild(A.el('div', 'muted', 'Drawback')); box.appendChild(A.el('div', 'bad', o.drawback));
      var u = view.unique;
      var ar = A.el('div', 'cost');
      ar.appendChild(A.el('div', 'c muted', 'Catalysts: ' + u.catalysts + ' · Fragments: ' + u.fragments));
      var ab = A.el('button', '', 'Assemble ' + Math.min(u.fragments, u.fragmentsNeeded) + '/' + u.fragmentsNeeded);
      ab.disabled = u.fragments < u.fragmentsNeeded || phase !== 'browse';
      ab.addEventListener('click', assemble); ar.appendChild(ab); box.appendChild(ar);
      box.appendChild(A.el('div', 'spacer'));
      var pz = view.respec;
      if (view.unique.currentId) {
        var pr = A.el('div', 'cost');
        pr.appendChild(A.el('div', 'c muted', 'Or swap it free with an Unbinding Prism (you hold ' + pz.prisms + ')'));
        var pb = A.el('button', '', 'Use Unbinding Prism');
        var why = pz.prismBlock || (o.current ? 'Already held' : '');
        pb.disabled = !!why || phase !== 'browse'; pb.title = why || 'Swaps in ' + o.name + ' with no Catalyst and no Tower Mark.';
        pb.addEventListener('click', function () { if (phase === 'browse') { action = 'prism'; phase = 'review'; render(); } });
        pr.appendChild(pb); box.appendChild(pr);
      }
      costRow(box, u.block || (o.current ? 'Already held' : '')); return;
    }
    var s = slot();
    if (!s) { box.appendChild(A.el('div', 'muted', 'Choose an affix on the left.')); return; }
    var prefix = s.category === 'prefix';
    box.appendChild(A.el('div', 'label', A.cap(mode) + ' · ' + (prefix ? 'Offense' : 'Defense')));
    box.appendChild(A.el('div', '', s.name));
    box.appendChild(A.el('div', 'muted', s.condition || (prefix ? 'Boosts your damage.' : 'Protects or heals you.')));
    var cur = vbox('Current · ' + A.roman[Math.max(1, Math.min(5, s.rank))], '+' + s.value + '%', 'Range ' + s.floor + '–' + s.bandMax + '%', false), nxt;
    if (mode === 'upgrade') {
      var top = s.nextMin < 0;
      nxt = vbox(top ? 'Top rank' : 'Next · ' + A.roman[s.rank + 1], top ? '—' : s.nextMin + '–' + s.nextMax + '%', top ? 'Cannot rise further' : 'New roll range', true);
    } else if (mode === 'refine') {
      nxt = vbox('Reroll', s.floor + '–' + s.bandMax + '%', s.floor > s.bandMin ? 'Never below your floor' : 'Same rank, new value', true);
    } else if (mode === 'overreach') {
      cur = vbox('Current', '+' + s.value + '%', s.sealed ? 'Sealed' : 'Band top ' + s.bandMax + '%', false);
      nxt = vbox(s.overreachChance + '% to win', '+' + s.overreachMin + '–' + s.overreachMax + '%', 'lose: it falls and seals', true);
    } else if (mode === 'perfect') {
      var capped = s.rank < 5 || s.floor >= s.bandMax;
      cur = vbox('Floor', '+' + s.floor + '%', 'value +' + s.value + '%', false);
      nxt = vbox(capped ? 'Not available' : 'New floor', capped ? '—' : '+' + (s.floor + 1) + '%', capped ? 'Band top ' + s.bandMax + '%' : 'value → +' + Math.max(s.value, s.floor + 1) + '%', true);
    } else {
      cur = vbox('Current · ' + A.roman[Math.max(1, Math.min(5, s.rank))], s.name, '+' + s.value + '% · rank ' + A.roman[Math.max(1, Math.min(5, s.rank))], false);
      nxt = vbox('New affix', '?', s.reforgePool + ' eligible', true);
    }
    pair(box, cur, nxt);
    var bar = A.el('div', 'bar');
    for (var i = 0; i < 5; i++) bar.appendChild(A.el('i', i < s.rank ? 'on' : (mode === 'upgrade' && i === s.rank && s.nextMin >= 0 ? 'next' : '')));
    box.appendChild(bar);
    box.appendChild(A.el('div', 'muted', mode === 'upgrade' ? 'Raises this affix one rank and rerolls its value. Never fails.'
      : mode === 'refine' ? "Rerolls the value inside this rank's range. It can go lower."
      : mode === 'perfect' ? 'Raises the lowest value this rank V affix can roll by one point, up to the band top. A Refine can never roll below it. Each step costs more dust; a Reforge clears it.'
      : mode === 'overreach' ? 'A gamble for a rank V affix at its band top, one attempt per affix. Win: a permanent value above the band top. Lose: the value drops into the lower half of the band, ignoring your floor. Win or lose the slot is sealed: only a Reforge can change it.'
      : 'Swaps this affix for a different one. Rank stays, value rerolls.'));
    box.appendChild(A.el('div', 'spacer'));
    costRow(box, blockFor(s));
  }

  function drawWallet() {
    var box = $('wallet'); box.innerHTML = ''; box.appendChild(A.el('div', 'label', 'Wallet'));
    var u = view.unique;
    [['Resonance Dust', 'resonance_dust', view.dust], ['Facets', 'facet', view.facets], ['Ascension Cores', 'ascension_core', view.cores],
     ['Scouters', 'scouter', view.scouters], ['Unique Fragments', 'unique_fragment', u.fragments], ['Unique Catalysts', 'unique_catalyst', u.catalysts], ['Tower Marks', 'tower_mark', view.marks], ['Hourglass', 'rank_respec', view.respec.hourglasses], ['Prism', 'unique_respec', view.respec.prisms]].forEach(function (c) {
      var r = A.el('div', 'coin'); r.title = c[0];
      var d = new Image(); d.className = 'dot'; d.alt = ''; d.src = 'icons/' + c[1] + '.png'; r.appendChild(d);
      r.appendChild(A.el('div', c[2] > 0 ? '' : 'muted', A.num(c[2])));
      var n = A.el('div', 'muted', c[0].split(' ').pop()); n.style.fontSize = '11px'; n.style.marginLeft = 'auto'; r.appendChild(n);
      box.appendChild(r);
    });
  }

  function drawDialog() {
    var scrim = $('scrim');
    if (phase === 'browse') { scrim.className = 'scrim'; return; }
    scrim.className = 'scrim on';
    var s = slot(), body = $('dBody'); body.innerHTML = '';
    $('dTitle').textContent = phase === 'waiting' ? 'Working…' : action === 'prism' ? 'Confirm unbinding' : action === 'buy' ? 'Confirm purchase' : mode === 'respec' ? 'Confirm respec' : 'Confirm ' + mode;
    var change = '';
    if (mode === 'upgrade' && s) change = s.name + ' ' + A.roman[s.rank] + ' +' + s.value + '%  →  ' + A.roman[Math.min(5, s.rank + 1)] + ', rolls ' + s.nextMin + '–' + s.nextMax + '%';
    else if (mode === 'refine' && s) change = s.name + ' +' + s.value + '%  →  a new value in ' + s.bandMin + '–' + s.bandMax + '%';
    else if (mode === 'overreach' && s) change = s.name + ' +' + s.value + '%  →  ' + s.overreachChance + '% chance of +' + s.overreachMin + '–' + s.overreachMax + '%; otherwise it falls to the lower half of the band. Either way the slot is sealed.';
    else if (mode === 'perfect' && s) change = s.name + ' floor +' + s.floor + '%  →  +' + (s.floor + 1) + '% (band top ' + s.bandMax + '%), value +' + s.value + '% → +' + Math.max(s.value, s.floor + 1) + '%';
    else if (mode === 'promote') change = A.rarityName(view.rarityId) + '  →  ' + A.rarityName(view.promotion.toRarity) + ', and one new rank I modifier';
    else if (action === 'buy') change = 'Trade ' + view.respec.price + ' Tower Marks for one Hourglass of Undoing.';
    else if (action === 'prism') { var po = uniqueOpt(); change = po ? 'Swap ' + view.uniqueName + ' for ' + po.name + '. Drawback: ' + po.drawback : ''; }
    else if (mode === 'respec') change = 'Reset ' + view.respec.resets.length + ' modifiers to rank I and return ' + view.respec.spent + (view.respec.spent === 1 ? ' upgrade credit' : ' upgrade credits') + '. Perfected floors are cleared.';
    else if (mode === 'unique') { var o = uniqueOpt(); change = o ? (view.unique.currentId ? 'Replace with ' : 'Install ') + o.name + '. Drawback: ' + o.drawback : ''; }
    else if (s) change = s.name + ' +' + s.value + '%  →  another affix (' + s.reforgePool + ' eligible), rank ' + A.roman[s.rank];
    body.appendChild(A.el('p', '', change));
    body.appendChild(A.el('p', 'gold', 'Cost: ' + (action === 'prism' ? '1 Unbinding Prism (no Catalyst, no Tower Mark)' : action === 'buy' ? view.respec.price + ' Tower Marks (you have ' + view.respec.marks + ')' : costText())));
    body.appendChild(A.el('p', 'muted', action === 'prism' ? 'Uses one Unbinding Prism. The Unique you hold now is lost. It cannot be undone.'
      : action === 'buy' ? 'The Marks are spent and the Hourglass joins your wallet.'
      : mode === 'respec' ? 'Uses one Hourglass of Undoing. Nothing is refunded and it cannot be undone. A Pokémon that has Overreached can never be respecced.'
      : mode === 'upgrade' ? 'No failure chance. This spends one pending upgrade.'
      : mode === 'refine' ? 'The result can be lower than now. It cannot be undone.'
      : mode === 'perfect' ? 'Always works. Each step costs 10 more dust than the last on this slot. A Refine keeps the floor; a Reforge clears it.'
      : mode === 'overreach' ? 'RISKY. The materials are spent win or lose. A lost attempt lowers the roll and seals the slot for good (a Reforge is the only way out). This cannot be undone.'
      : mode === 'promote' ? 'No failure chance. Existing modifiers are kept. It cannot be undone.'
      : mode === 'unique' ? 'Uses one Catalyst. A Unique already set is lost. It cannot be undone.' : 'The result is random and cannot be undone.'));
    if (phase === 'waiting') body.appendChild(A.el('p', 'muted', 'Waiting for the server…'));
    $('dOk').disabled = phase === 'waiting'; $('dCancel').disabled = phase === 'waiting';
  }

  function render() {
    if (!view) return;
    A.text($('name'), view.name); A.text($('lvl'), 'Lv ' + view.level);
    var gr = $('grade'); A.text(gr, (view.rarityId === 'mythical' ? 'MYTHIC' : view.rarityId.toUpperCase()) + (view.uniqueName ? ' · UNIQUE' : ''));
    gr.style.background = 'var(--' + (view.rarityId || 'common') + '-bg)'; gr.style.color = 'var(--' + (view.rarityId || 'common') + ')';
    var art = $('art'); art.innerHTML = ''; art.appendChild(A.sprite(view.speciesId, 2)); A.setBezel(view.rarityId); A.setBezel(view.rarityId);
    A.text($('pend'), view.pending); A.text($('pendLabel'), view.pending === 1 ? 'upgrade available' : 'upgrades available');
    A.text($('next'), view.nextMilestone > 0 ? 'Next upgrade at Lv ' + view.nextMilestone : 'All level milestones reached');
    $('fuse').style.display = view.rarityId === 'mythical' ? '' : 'none';
    drawTabs(); drawList(); drawDetail(); drawWallet(); drawDialog();
  }

  function submit(kind, slot) {
    pendingOp = A.newId(); phase = 'waiting'; render();
    A.send('ascension_craft_confirm', { operationId: pendingOp, pokemonId: view.pokemonId, kind: kind, slotId: slot || '',
      profileRevision: view.profileRevision, walletRevision: view.walletRevision });
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () {
      if (phase === 'waiting') { phase = 'browse'; pendingOp = ''; banner = 'No answer from the server. Check your materials and try again.'; bannerOk = false; render(); }
    }, 8000);
  }
  function confirm() {
    if (phase !== 'review' || !(action === 'buy' ? view.respec.marks >= view.respec.price : action === 'prism' ? (!view.respec.prismBlock && !!uniqueId && uniqueId !== view.unique.currentId) : canReview())) return;
    var s = slot();
    if (action === 'buy') { submit('buy_hourglass', ''); return; }
    if (action === 'prism') { submit('respec_unique', uniqueId); return; }
    if (mode === 'respec') { submit('respec_ranks', ''); return; }
    submit(mode, mode === 'promote' ? '' : mode === 'unique' ? uniqueId : s.slotId);
  }
  function assemble() {
    if (phase !== 'browse' || mode !== 'unique' || view.unique.fragments < view.unique.fragmentsNeeded) return;
    submit('assemble', '');
  }

  A.on('craftView', function (v) {
    var first = !view; view = v; tries = 99;
    if (first) { mode = v.pending > 0 ? 'upgrade' : 'refine'; if (v.slots.length) slotId = v.slots[0].slotId; }
    uniqueId = validUnique(uniqueId);
    var found = false; v.slots.forEach(function (s) { if (s.slotId === slotId) found = true; });
    if (!found) slotId = v.slots.length ? v.slots[0].slotId : '';
    if (v.message && !banner) { banner = v.message; bannerOk = false; }
    render();
  });
  A.on('craftDone', function (d) {
    if (d.operationId !== pendingOp) return;
    clearTimeout(waitTimer); pendingOp = ''; phase = 'browse'; bannerOk = !!d.ok;
    var did = action; action = '';
    if (d.ok) {
      var was = A.roman[Math.max(1, Math.min(5, d.oldRank))], now = A.roman[Math.max(1, Math.min(5, d.newRank))];
      banner = did === 'buy' ? 'Bought an Hourglass of Undoing for ' + view.respec.price + ' Tower Marks'
        : did === 'prism' ? 'Unique swapped: ' + d.newName
        : mode === 'respec' ? 'Reset to rank I: ' + d.oldValue + (d.oldValue === 1 ? ' upgrade credit' : ' upgrade credits') + ' back to spend'
        : mode === 'upgrade' ? d.newName + ' → ' + now + ' +' + d.newValue + '%'
        : mode === 'refine' ? 'Refined: +' + d.oldValue + '% → +' + d.newValue + '%'
        : mode === 'perfect' ? 'Floor raised: +' + d.oldValue + '% → +' + d.newValue + '%'
        : mode === 'overreach' ? (d.newValue > d.oldValue ? 'Overreached! +' + d.oldValue + '% → +' + d.newValue + '%' : 'The gamble failed: +' + d.oldValue + '% → +' + d.newValue + '%, and the slot is sealed')
        : mode === 'reforge' ? 'Now ' + d.newName + ' +' + d.newValue + '%'
        : mode === 'promote' ? 'Promoted to ' + A.rarityName(d.newName) + ': a new modifier slot opened'
        : (d.newName === 'Unique Catalyst' ? 'Assembled a Unique Catalyst' : 'Unique set: ' + d.newName);
      if (d.replayed) banner += ' (already done)';
    } else banner = d.message;
    if (mode === 'overreach' && d.ok) bannerOk = d.newValue > d.oldValue;
    render();
  });

  $('bank').addEventListener('click', function () { if (phase === 'browse') A.send('ascension_wallet_open'); });
  $('close').addEventListener('click', function () { if (phase !== 'waiting') A.send('close'); });
  $('later').addEventListener('click', function () { if (phase !== 'waiting') A.send('close'); });
  $('fuse').addEventListener('click', function () { if (view && phase === 'browse') A.send('ascension_fusion_open', { hostId: view.pokemonId }); });
  $('dCancel').addEventListener('click', function () { if (phase === 'review') { phase = 'browse'; action = ''; render(); } });
  $('dOk').addEventListener('click', confirm);

  function ready() {
    if (!A.g) { A.text($('next'), 'This page needs the WebGUI mod.'); return; }
    A.send('ascension_craft_ready');
    if (++tries < 4) setTimeout(function () { if (!view) ready(); }, 2000);
  }
  ready();
})();
</script>
</body>
</html>
