<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture reveal</title>
<link rel="stylesheet" href="ascension.css">
<link rel="stylesheet" href="capture.css">
<style>html, body { background: transparent; overflow: hidden; } body { display: block; }</style>
</head>
<body class="capture-page">
<div id="capture-root" aria-live="polite" aria-atomic="true"></div>
<script src="ui.js"></script>
<script src="capture-flip.js"></script>
<script src="capture.js"></script>
<script>
(function () {
  var A = window.A, closing = false;
  function closePage() {
    if (closing) return;
    closing = true;
    A.captureReveal.clear();
    A.send('close'); // WebGUI closes its native GUI screen and restores Minecraft's mouse.
  }
  A.captureReveal.onDismiss = function (r) { A.send('ascension_capture_dismiss', { revealId: r.revealId || r.pokemonId }); };
  A.captureReveal.onDisable = function () { A.send('ascension_capture_disable'); closePage(); };
  A.on('captureClosed', closePage);
  window.addEventListener('pagehide', function () {
    var id = A.captureReveal.currentId();
    if (id) A.send('ascension_capture_closed', { revealId: id });
    A.captureReveal.clear();
  });
  if (A.g) A.send('ascension_capture_ready');
})();
</script>
</body>
</html>
