<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AscensionDex</title>
<link rel="stylesheet" href="ascension.css">
<style>
  .frame { width: 860px; height: 600px; }
  .main { flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .hint { color: var(--muted); font-size: 11px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 6px; min-height: 0;
          background: var(--row); border: 2px solid var(--line); cursor: pointer; text-align: center; }
  .card:hover { border-color: var(--acc); }
  .card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--outline), 0 0 12px rgba(242, 207, 58, .45); background: var(--panel); }
  .card.empty { cursor: default; opacity: .45; border-style: dashed; }
  .card .slot { position: absolute; left: 6px; top: 4px; font-size: 10px; color: var(--muted); }
  .card .badge { position: absolute; right: 6px; top: 4px; font-size: 10px; padding: 0 5px; background: #0d2a1c; color: var(--good); border: 1px solid var(--good); }
  .card .spr { width: 96px; height: 80px; display: flex; align-items: center; justify-content: center; flex: none; }
  .card .nm { font-size: 13px; text-shadow: var(--glow); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; }
  .tag { font-size: 10px; font-weight: 700; padding: 0 6px; background: #46526a; color: #fff; }
  .hp { width: 80%; height: 6px; background: var(--well); border: 1px solid var(--line); } .hp i { display: block; height: 100%; background: var(--good); }
  .hp.low i { background: var(--gold); } .hp.crit i { background: var(--warn); }
  .card.faint .nm { color: var(--warn); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .pane[hidden] { display: none; }
  /* the tab bar sits at the bottom of the Dex, above the footer */
  .tabbar { display: flex; gap: 0; padding: 0 14px; background: var(--head); border-top: 2px solid var(--line); }
  .tabbar button { border-top: 0; border-radius: 0; padding: 8px 22px; margin-right: 4px; box-shadow: none; background: transparent; color: var(--muted); border-color: transparent; letter-spacing: .08em; }
  .tabbar button.on { color: var(--acc); background: var(--panel); border: 2px solid var(--line); border-top: 3px solid var(--acc); border-bottom: 0; }
  .foot .group[hidden] { display: none; } .foot .group { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>ASCENSIONDEX</span><button class="x" id="close" title="Close">&times;</button></div>
  <div class="main">
    <div class="pane" id="paneParty">
      <div class="hint">Your party. Pick a Pokemon (double-click inspects it).</div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="pane" id="paneWallet" hidden></div>
    <div class="pane" id="paneGuide" hidden></div>
  </div>
  <div class="tabbar" id="tabbar">
    <button class="on" id="tabParty">Party</button>
    <button id="tabWallet">Wallet</button>
    <button id="tabGuide">Guide</button>
    <button id="tabFuse" disabled>Fuse</button>
  </div>
  <div class="foot">
    <div class="msg muted" id="info"></div>
    <div class="group" id="footParty">
      <button id="upgrade" disabled>Upgrade</button>
      <button class="primary" id="inspect" disabled>Inspect</button>
    </div>
    <div class="group" id="footWallet" hidden>
      <button class="primary" id="depositAll" disabled>Deposit all vouchers</button>
    </div>
    <button id="done">Close</button>
  </div>
</div>
<script src="ui.js"></script>
<script src="wallet-panel.js"></script>
<script src="guide-data.js"></script>
<script src="guide-panel.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var view = null, sel = -1, tab = 'party', wallet = null, guide = null, partyInfo = '';

  var cards = [];   // the drawn cards by slot, so choosing one only moves the highlight instead of rebuilding the grid and re-decoding every sprite

  function pick(i) { sel = i; select(); }
  function inspect() { var s = view && view.slots[sel]; if (s && s.id) A.send('ascension_inspect_open', { kind: 'owned', id: s.id }); }

  function draw() {
    if (!view) return;
    var grid = $('grid'); grid.innerHTML = ''; cards = [];
    view.slots.forEach(function (s, i) {
      var card = A.el('div', 'card' + (s.id ? '' : ' empty') + (s.fainted ? ' faint' : ''));
      cards.push(card);
      card.appendChild(A.el('span', 'slot', String(i + 1)));
      if (!s.id) { card.appendChild(A.el('div', 'sub', 'Empty slot')); grid.appendChild(card); return; }
      if (s.pending > 0) card.appendChild(A.el('span', 'badge', s.pending + (s.pending === 1 ? ' upgrade' : ' upgrades')));
      var spr = A.el('div', 'spr'); spr.appendChild(A.sprite(s.speciesId, 2)); card.appendChild(spr);
      card.appendChild(A.el('div', 'nm', (s.shiny ? '★ ' : '') + s.name));
      var sub = A.el('div', 'sub'); sub.appendChild(A.el('span', '', 'Lv ' + s.level));
      var tag = A.el('span', 'tag', s.rarityId ? A.rarityName(s.rarityId) : 'No profile');
      if (s.rarityId) { tag.style.background = 'var(--' + s.rarityId + '-bg)'; tag.style.color = 'var(--' + s.rarityId + ')'; }
      sub.appendChild(tag); card.appendChild(sub);
      var hp = A.el('div', 'hp' + (s.hp < 25 ? ' crit' : s.hp < 50 ? ' low' : '')); var fill = A.el('i'); fill.style.width = s.hp + '%'; hp.appendChild(fill); card.appendChild(hp);
      card.addEventListener('click', function () { pick(i); });
      card.addEventListener('dblclick', function () { pick(i); inspect(); });
      grid.appendChild(card);
    });
    select();
  }

  /** Highlights the chosen card and sets the buttons and the footer line to match it. */
  function select() {
    cards.forEach(function (card, i) { card.classList.toggle('sel', i === sel); });
    var s = view.slots[sel];
    $('inspect').disabled = !(s && s.id);
    $('upgrade').disabled = !(s && s.id && s.rarityId && !s.locked);
    $('upgrade').title = s && s.locked ? 'This Pokemon is on loan and cannot be upgraded.' : s && s.id && !s.rarityId ? 'It has no ascension profile yet: inspect it to use an Ascension Sigil.' : '';
    $('tabFuse').disabled = !(s && s.id);
    $('tabFuse').title = s && s.id ? 'Fuse: open the fusion screen with ' + s.name + ' as the host (a Mythic with a Unique can be one; you can change it there).' : 'Pick a Pokemon first.';
    partyInfo = s && s.id ? s.name + (s.rarityId ? '' : ' has no ascension profile') : 'Pick a Pokemon';
    if (tab === 'party') A.text($('info'), partyInfo);
  }

  A.on('partyView', function (v) { view = v; if (sel < 0 || !v.slots[sel] || !v.slots[sel].id) { sel = -1; for (var i = 0; i < v.slots.length; i++) if (v.slots[i].id) { sel = i; break; } } draw(); });
  // The two tabs: the party, and the wallet (the same panel as the Wallet page, mounted the first time it is opened).
  function showTab(name) {
    tab = name;
    $('paneParty').hidden = name !== 'party'; $('paneWallet').hidden = name !== 'wallet'; $('paneGuide').hidden = name !== 'guide';
    $('footParty').hidden = name !== 'party'; $('footWallet').hidden = name !== 'wallet';
    $('tabParty').className = name === 'party' ? 'on' : ''; $('tabWallet').className = name === 'wallet' ? 'on' : ''; $('tabGuide').className = name === 'guide' ? 'on' : '';
    if (name === 'wallet') {
      if (!wallet) wallet = A.wallet.mount($('paneWallet'), {
        onView: function (v) {
          if (tab === 'wallet') A.text($('info'), v.freeSlots + ' free inventory slot' + (v.freeSlots === 1 ? '' : 's') + ' (64 units per slot)');
          $('depositAll').disabled = !v.lines.some(function (l) { return l.carried > 0; });
        }
      });
      wallet.refresh();
      var v = wallet.view();
      if (v) A.text($('info'), v.freeSlots + ' free inventory slot' + (v.freeSlots === 1 ? '' : 's') + ' (64 units per slot)'); else A.text($('info'), 'Loading wallet…');
    } else if (name === 'guide') {
      if (!guide) guide = A.guide.mount($('paneGuide'));
      A.text($('info'), 'How AscensionLib works. The same text is on the wiki.');
    } else A.text($('info'), partyInfo);
  }
  $('tabParty').addEventListener('click', function () { showTab('party'); });
  $('tabWallet').addEventListener('click', function () { showTab('wallet'); });
  $('tabGuide').addEventListener('click', function () { showTab('guide'); });
  // Fuse is not a tab: it opens the fusion screen (the craft screen's Fuse button sends the same message) with the chosen Pokemon as the host.
  $('tabFuse').addEventListener('click', function () { var s = view && view.slots[sel]; if (s && s.id && !$('tabFuse').disabled) A.send('ascension_fusion_open', { hostId: s.id }); });
  $('depositAll').addEventListener('click', function () { if (wallet) wallet.depositAll(); });
  $('inspect').addEventListener('click', inspect);
  $('upgrade').addEventListener('click', function () { var s = view && view.slots[sel]; if (s && s.id && !$('upgrade').disabled) A.send('ascension_craft_open', { pokemonId: s.id }); });
  $('close').addEventListener('click', function () { A.send('close'); });
  $('done').addEventListener('click', function () { A.send('close'); });

  function ready() {
    A.ready('ascension_party_ready', function () { return !!view; }, $('info'));
  }
  ready();
})();
</script>
</body>
</html>
