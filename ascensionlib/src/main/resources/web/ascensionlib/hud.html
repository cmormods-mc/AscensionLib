<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascension HUD</title>
<link rel="stylesheet" href="ascension.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  body { display: block; }
  #toasts { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: 340px; }
  .card { width: 100%; background: var(--panel); border: 3px solid var(--edge); box-shadow: inset 0 0 0 2px #fff, 0 6px 18px rgba(0,0,0,.45); display: flex; gap: 10px; padding: 8px 10px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  .card .sprbox { width: 96px; height: 64px; background: var(--row); border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; flex: none; }
  .card .nm { font-weight: 700; } .card .g { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; color: #fff; }
  .card ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; } .card li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel { position: fixed; right: 12px; top: 90px; width: 270px; background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #fff, 0 6px 18px rgba(0,0,0,.4); display: none; font-size: 13px; }
  #panel.on { display: block; }
  #panel .h { display: flex; justify-content: space-between; align-items: center; background: var(--head); padding: 5px 10px; font-weight: 600; cursor: pointer; }
  #panel .sec { padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #panel .r { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-bottom: 1px solid var(--line); background: var(--row); }
  #panel .r .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #panel .r .n:hover { text-decoration: underline; }
  #panel .tag { font-size: 11px; font-weight: 700; padding: 0 6px; color: #fff; background: #46526a; }
  #panel button { padding: 2px 8px; font-size: 12px; }
  #panel.min .body { display: none; }
  #panel .hint { padding: 4px 10px 6px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body class="hud">
<div id="toasts"></div>
<div id="panel">
  <div class="h" id="ph"><span id="ptitle">Ascension</span><span id="pcaret">&#9662;</span></div>
  <div class="body">
    <div class="sec">Opponents <span id="scouters" style="float:right"></span></div>
    <div id="opp"></div>
    <div class="sec">Your team</div>
    <div id="team"></div>
    <div class="hint">Press the WebGUI interact key to click.</div>
  </div>
</div>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var SHOW_MS = 9000, MAX_TOASTS = 3, idleTimer = 0;
  var scout = { entries: [], scouters: 0, encounterId: '' }, team = [], shownToasts = 0;

  function rarityTag(id) {
    var t = A.el('span', 'tag', id ? A.rarityName(id) : '?');
    if (id) { t.style.background = 'var(--' + id + '-bg)'; t.style.color = 'var(--' + id + ')'; }
    return t;
  }

  function toast(r) {
    if (shownToasts >= MAX_TOASTS) { setTimeout(function () { toast(r); }, 1500); return; }
    shownToasts++;
    var d = r.detail, card = A.el('div', 'card');
    card.style.borderColor = 'var(--' + d.rarityId + ')';
    card.appendChild(A.sprite(r.speciesId, 2));
    var col = A.el('div'); col.style.minWidth = '0';
    col.appendChild(A.el('div', 'nm', r.name));
    var g = A.el('span', 'g', (d.rarityId === 'mythical' ? 'MYTHIC' : d.rarityId.toUpperCase()) + (d.uniqueName ? ' · UNIQUE' : ''));
    g.style.background = 'var(--' + d.rarityId + '-bg)'; g.style.color = 'var(--' + d.rarityId + ')'; col.appendChild(g);
    var ul = A.el('ul');
    if (d.uniqueName) ul.appendChild(A.el('li', '', '★ ' + d.uniqueName));
    d.slots.slice(0, 4).forEach(function (s) { ul.appendChild(A.el('li', '', s.name + ' +' + s.value + '%')); });
    col.appendChild(ul); card.appendChild(col);
    $('toasts').appendChild(card);
    setTimeout(function () { card.remove(); shownToasts--; maybeIdle(); }, SHOW_MS);
    clearTimeout(idleTimer);
  }

  function drawPanel() {
    var p = $('panel');
    var any = scout.entries.length > 0;
    p.className = (any ? 'on' : '') + (p.className.indexOf('min') >= 0 ? ' min' : '');
    if (!any) { maybeIdle(); return; }
    clearTimeout(idleTimer);
    A.text($('scouters'), 'Scouters: ' + scout.scouters);
    var opp = $('opp'); opp.innerHTML = '';
    scout.entries.forEach(function (e) {
      var row = A.el('div', 'r');
      var n = A.el('span', 'n', e.name); n.title = 'Inspect';
      n.addEventListener('click', function () { A.send('ascension_inspect_open', { kind: 'enemy', id: '' }); });
      row.appendChild(n); row.appendChild(rarityTag(e.detail ? e.detail.rarityId : ''));
      if (!e.detail) {
        var b = A.el('button', '', 'Scout'); b.disabled = scout.scouters < 1;
        b.addEventListener('click', function () { b.disabled = true; A.send('ascension_inspect_use', { encounterId: scout.encounterId, subjectId: e.subjectId }); });
        row.appendChild(b);
      }
      opp.appendChild(row);
    });
    var tm = $('team'); tm.innerHTML = '';
    team.forEach(function (m) {
      var row = A.el('div', 'r');
      var n = A.el('span', 'n', m.name + ' · Lv ' + m.level); n.title = 'Inspect';
      n.addEventListener('click', function () { A.send('ascension_inspect_open', { kind: 'owned', id: m.id }); });
      row.appendChild(n); row.appendChild(rarityTag(m.rarityId)); tm.appendChild(row);
    });
  }

  /** When nothing is left to show, the overlay closes itself so it never lingers over the game. */
  function maybeIdle() {
    clearTimeout(idleTimer);
    if (shownToasts > 0 || scout.entries.length > 0) return;
    idleTimer = setTimeout(function () {
      if (shownToasts > 0 || scout.entries.length > 0) return;
      A.send('ascension_hud_closed'); A.send('close');
    }, 2500);
  }

  A.on('hudReveal', function (r) { toast(r); });
  A.on('hudScout', function (s) { scout = s; drawPanel(); });
  A.on('hudTeam', function (t) { team = t; drawPanel(); });
  $('ph').addEventListener('click', function () {
    var p = $('panel'); p.className = p.className.indexOf('min') >= 0 ? p.className.replace(' min', '') : p.className + ' min';
    A.text($('pcaret'), p.className.indexOf('min') >= 0 ? '▸' : '▾');
  });
  if (A.g) A.send('ascension_hud_ready'); else A.text($('ptitle'), 'WebGUI missing');
  maybeIdle();
})();
</script>
</body>
</html>
