<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ascension HUD</title>
<link rel="stylesheet" href="ascension.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  body { display: block; }
  #toasts { transform: translateX(-50%) scale(var(--ui-scale, 1)); transform-origin: top center; position: fixed; top: 14px; left: 50%; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 340px; }
  .card { width: 100%; background: var(--panel); border: 3px solid var(--edge); box-shadow: inset 0 0 0 2px #fff, 0 0 0 3px #1b120d; display: flex; gap: 10px; padding: 8px 10px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  .card .sprbox { width: 96px; height: 64px; background: var(--row); border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; flex: none; }
  .card .nm { font-weight: 700; } .card .g { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; color: #fff; }
  .card ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; } .card li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .afx-s { width: 16px; height: 16px; vertical-align: middle; margin-right: 4px; }
  #panel { transform: scale(var(--ui-scale, 1)); transform-origin: top right; position: fixed; right: 12px; top: 90px; width: 270px; user-select: none; background: var(--panel); border: 2px solid var(--edge); box-shadow: inset 0 0 0 1px #fff, 0 0 0 3px #1b120d; display: none; font-size: 13px; }
  #panel.on { display: block; }
  #panel .h { display: flex; justify-content: space-between; align-items: center; background: var(--head); padding: 5px 10px; font-weight: 600; cursor: move; }
  #panel .sec { padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #panel .r { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-bottom: 1px solid var(--line); background: var(--row); }
  #panel .r .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #panel .r .n:hover { text-decoration: underline; }
  #panel .tag { font-size: 11px; font-weight: 700; padding: 0 6px; color: #fff; background: #46526a; }
  #panel button { padding: 2px 8px; font-size: 12px; }
  #panel.min .body { display: none; }
  #left { transform: scale(var(--ui-scale, 1)); transform-origin: top left; position: fixed; left: 12px; top: 90px; display: flex; flex-direction: column; gap: 5px; }
  #bleeds, #effects { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .bleed { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 6px; background: #2a0b12; border: 2px solid #c4283c; box-shadow: 0 0 0 2px #1b120d; color: #ffd6da; font-size: 12px; animation: in .25s ease-out; }
  .bleed.foe { border-color: #e08a2c; background: #2a1a0b; color: #ffe6c8; }
  .bleed .drop { width: 10px; height: 14px; flex: none; background: #ff3448; border: 2px solid #1b120d; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; }
  .bleed.foe .drop { background: #ff9a3c; }
  .bleed .st { color: #ff8896; font-weight: 700; } .bleed.foe .st { color: #ffc078; }
  /* effect badges: Momentum stays while its holder is on the field; Wardstone and Ensnaring flash once. Your side blue, the foe's orange, like the bleed badges. */
  .eff { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 6px; background: #0b1c2a; border: 2px solid #3d8fd1; box-shadow: 0 0 0 2px #1b120d; color: #d6ebff; font-size: 12px; animation: in .25s ease-out; }
  .eff.foe { border-color: #e08a2c; background: #2a1a0b; color: #ffe6c8; }
  .eff .ic { width: 12px; height: 12px; flex: none; border: 2px solid #1b120d; background: #5db0f0; }
  .eff.foe .ic { background: #ff9a3c; }
  .eff.mom .ic { background: #f2cf3a; transform: rotate(45deg); }
  .eff.wardstone .ic { border-radius: 50% 50% 4px 4px; }
  .eff.ensnaring .ic { background: repeating-linear-gradient(45deg, #5db0f0 0 2px, #1b120d 2px 4px); }
  .eff .st { font-weight: 700; color: #f2cf3a; } .eff.flash .st { color: #9fd4ff; } .eff.foe.flash .st { color: #ffc078; }
  #panel .hint { padding: 4px 10px 6px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body class="hud">
<div id="toasts"></div>
<div id="left"><div id="bleeds"></div><div id="effects"></div></div>
<div id="panel">
  <div class="h" id="ph"><span id="ptitle">Ascension</span><span id="pcaret">&#9662;</span></div>
  <div class="body">
    <div class="sec">Opponents <span id="scouters" style="float:right"></span></div>
    <div id="opp"></div>
    <div class="sec">Your team</div>
    <div id="team"></div>
    <div class="hint">Press the WebGUI interact key to click.</div>
  </div>
</div>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var SHOW_MS = 9000, MAX_TOASTS = 3, idleTimer = 0;
  var scout = { entries: [], scouters: 0, encounterId: '' }, team = [], shownToasts = 0, bleeds = [], momentum = [], flashes = 0;

  function rarityTag(id) {
    var t = A.el('span', 'tag', id ? A.rarityName(id) : '?');
    if (id) { t.style.background = 'var(--' + id + '-bg)'; t.style.color = 'var(--' + id + ')'; }
    return t;
  }

  function toast(r) {
    if (shownToasts >= MAX_TOASTS) { setTimeout(function () { toast(r); }, 1500); return; }
    shownToasts++;
    var d = r.detail, card = A.el('div', 'card');
    card.style.borderColor = 'var(--' + d.rarityId + ')';
    card.appendChild(A.sprite(r.speciesId, 2));
    var col = A.el('div'); col.style.minWidth = '0';
    col.appendChild(A.el('div', 'nm', r.name));
    var g = A.el('span', 'g', (d.rarityId === 'mythical' ? 'MYTHIC' : d.rarityId.toUpperCase()) + (d.uniqueName ? ' · UNIQUE' : ''));
    g.style.background = 'var(--' + d.rarityId + '-bg)'; g.style.color = 'var(--' + d.rarityId + ')'; col.appendChild(g);
    var ul = A.el('ul');
    if (d.uniqueName) ul.appendChild(A.el('li', '', '★ ' + d.uniqueName));
    d.slots.slice(0, 4).forEach(function (s) { var li = A.el('li', '', s.name + ' +' + s.value + '%'); li.insertBefore(A.affixIcon(s.name, false, 'afx-s'), li.firstChild); ul.appendChild(li); });
    col.appendChild(ul); card.appendChild(col);
    $('toasts').appendChild(card);
    setTimeout(function () { card.remove(); shownToasts--; maybeIdle(); }, SHOW_MS);
    clearTimeout(idleTimer);
  }

  function drawPanel() {
    var p = $('panel');
    var any = scout.entries.length > 0;
    p.className = (any ? 'on' : '') + (p.className.indexOf('min') >= 0 ? ' min' : '');
    if (!any) { maybeIdle(); return; }
    clearTimeout(idleTimer);
    A.text($('scouters'), 'Scouters: ' + scout.scouters);
    var opp = $('opp'); opp.innerHTML = '';
    scout.entries.forEach(function (e) {
      var row = A.el('div', 'r');
      var n = A.el('span', 'n', e.name); n.title = 'Inspect';
      n.addEventListener('click', function () { A.send('ascension_inspect_open', { kind: 'enemy', id: '' }); });
      row.appendChild(n); row.appendChild(rarityTag(e.detail ? e.detail.rarityId : ''));
      if (!e.detail) {
        var b = A.el('button', '', 'Scout'); b.disabled = scout.scouters < 1;
        b.addEventListener('click', function () { b.disabled = true; A.send('ascension_inspect_use', { encounterId: scout.encounterId, subjectId: e.subjectId }); });
        row.appendChild(b);
      }
      opp.appendChild(row);
    });
    var tm = $('team'); tm.innerHTML = '';
    team.forEach(function (m) {
      var row = A.el('div', 'r');
      var n = A.el('span', 'n', m.name + ' · Lv ' + m.level); n.title = 'Inspect';
      n.addEventListener('click', function () { A.send('ascension_inspect_open', { kind: 'owned', id: m.id }); });
      row.appendChild(n); row.appendChild(rarityTag(m.rarityId)); tm.appendChild(row);
    });
    if (window.place) window.place();
  }

  function busy() { return shownToasts > 0 || scout.entries.length > 0 || bleeds.length > 0 || momentum.length > 0 || flashes > 0; }

  /** When nothing is left to show, the overlay closes itself so it never lingers over the game. */
  function maybeIdle() {
    clearTimeout(idleTimer);
    if (busy()) return;
    idleTimer = setTimeout(function () {
      if (busy()) return;
      A.send('ascension_hud_idle');   // the server answers hudClose, unless a full-screen page is open (the client's close would close that page)
    }, 2500);
  }
  A.on('hudClose', function () {
    if (busy()) return;
    A.send('ascension_hud_closed'); A.send('close');
  });

  /** A badge per bleeding Pokemon: a drop, the name, the stacks and the turns left. Your side is red, the foe's orange. */
  function drawBleeds() {
    var box = $('bleeds'); box.innerHTML = '';
    bleeds.forEach(function (b) {
      var chip = A.el('div', 'bleed' + (b.side === 'foe' ? ' foe' : ''));
      chip.appendChild(A.el('span', 'drop'));
      chip.appendChild(A.el('span', '', b.name));
      chip.appendChild(A.el('span', 'st', 'BLEED x' + b.stacks + ' \u00b7 ' + b.turnsLeft + (b.turnsLeft === 1 ? ' turn' : ' turns')));
      chip.title = 'Bleeding: ' + b.stacks + ' stack' + (b.stacks === 1 ? '' : 's') + ', ' + b.turnsLeft + ' turn' + (b.turnsLeft === 1 ? '' : 's') + ' left';
      box.appendChild(chip);
    });
    if (bleeds.length) clearTimeout(idleTimer); else maybeIdle();
  }

  /** Standing Momentum badges (replaced on every update) and one-time Wardstone/Ensnaring flashes (shown for a few seconds). */
  var FLASH = { wardstone: ['WARDSTONE', 'status resisted'], ensnaring: ['ENSNARED', 'Speed lowered'] };
  function drawEffects(e) {
    var box = $('effects');
    Array.prototype.slice.call(box.querySelectorAll('.mom')).forEach(function (c) { c.remove(); });
    momentum = e.momentum || [];
    momentum.forEach(function (m) {
      var chip = A.el('div', 'eff mom' + (m.side === 'foe' ? ' foe' : ''));
      chip.appendChild(A.el('span', 'ic')); chip.appendChild(A.el('span', '', m.name));
      chip.appendChild(A.el('span', 'st', 'MOMENTUM x' + m.stacks));
      chip.title = 'Momentum: each KO adds to the damage of ' + m.name + ' until it leaves the field';
      box.insertBefore(chip, box.querySelector('.flash'));   // in arrival order, ahead of any flash
    });
    (e.procs || []).forEach(function (p) {
      var f = FLASH[p.kind]; if (!f) return;
      var chip = A.el('div', 'eff flash ' + p.kind + (p.side === 'foe' ? ' foe' : ''));
      chip.appendChild(A.el('span', 'ic')); chip.appendChild(A.el('span', '', p.name));
      chip.appendChild(A.el('span', 'st', f[0] + ': ' + f[1]));
      box.appendChild(chip); flashes++;
      setTimeout(function () { chip.remove(); flashes--; maybeIdle(); }, 3500);
    });
    if (busy()) clearTimeout(idleTimer); else maybeIdle();
  }

  A.on('hudEffects', drawEffects);
  A.on('hudBleed', function (list) { bleeds = list || []; drawBleeds(); });
  A.on('hudReveal', function (r) { toast(r); });
  A.on('hudScout', function (s) { scout = s; drawPanel(); });
  A.on('hudTeam', function (t) { team = t; drawPanel(); });
  /**
   * The panel sits on the right, midway between the battle log (bottom) and the opponent's HP bar (top) until the player drags it by
   * its title. A drag is remembered (as fractions of the window, so it survives a resize); double-click the title to put it back.
   * A click without movement still folds the panel.
   */
  var POS_KEY = 'ascensionlib.hud.panel', saved = null, drag = null;
  try { saved = JSON.parse(localStorage.getItem(POS_KEY) || 'null'); } catch (e) { saved = null; }
  window.place = place;
  function place() {
    var p = $('panel'), w = window.innerWidth, h = window.innerHeight;
    var scale = parseFloat(getComputedStyle(p).getPropertyValue('--ui-scale')) || 1;
    var ph = p.offsetHeight * scale, pw = p.offsetWidth * scale;
    var right, top;
    if (saved && isFinite(saved.r) && isFinite(saved.t)) { right = saved.r * w; top = saved.t * h; }
    else { right = 12; top = h * 0.46 - ph / 2; }
    right = Math.max(0, Math.min(right, w - pw)); top = Math.max(0, Math.min(top, h - ph));
    p.style.right = right + 'px'; p.style.top = top + 'px';
  }
  function remember() {
    var p = $('panel');
    saved = { r: parseFloat(p.style.right) / window.innerWidth, t: parseFloat(p.style.top) / window.innerHeight };
    try { localStorage.setItem(POS_KEY, JSON.stringify(saved)); } catch (e) { /* not kept this time */ }
  }
  $('ph').addEventListener('mousedown', function (ev) {
    var p = $('panel');
    drag = { x: ev.clientX, y: ev.clientY, r: parseFloat(p.style.right) || 12, t: parseFloat(p.style.top) || 90, moved: false };
  });
  document.addEventListener('mousemove', function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    drag.moved = true;
    var p = $('panel');
    p.style.right = (drag.r - dx) + 'px'; p.style.top = (drag.t + dy) + 'px';
    saved = { r: parseFloat(p.style.right) / window.innerWidth, t: parseFloat(p.style.top) / window.innerHeight };
    place();
  });
  document.addEventListener('mouseup', function () { if (drag && drag.moved) remember(); });
  $('ph').addEventListener('click', function () {
    var moved = drag && drag.moved; drag = null;
    if (moved) return;
    var p = $('panel'); p.className = p.className.indexOf('min') >= 0 ? p.className.replace(' min', '') : p.className + ' min';
    A.text($('pcaret'), p.className.indexOf('min') >= 0 ? '▸' : '▾');
    if (!saved) place();
  });
  $('ph').addEventListener('dblclick', function () {
    saved = null; try { localStorage.removeItem(POS_KEY); } catch (e) { /* nothing to clear */ }
    place();
  });
  window.addEventListener('resize', place);
  if (A.g) A.send('ascension_hud_ready'); else A.text($('ptitle'), 'WebGUI missing');
  maybeIdle();
})();
</script>
</body>
</html>
