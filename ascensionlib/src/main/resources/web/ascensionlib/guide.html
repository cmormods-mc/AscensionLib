<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AscensionLib guide</title>
<meta name="color-scheme" content="dark">
<style>html, body { background: transparent; }</style>
<link rel="stylesheet" href="ascension.css">
<style>
  .frame { width: 960px; height: 620px; }
  .main { flex: 1; min-height: 0; padding: 12px 14px; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>GUIDE</span><button class="x" id="close" title="Close">&times;</button></div>
  <div class="main" id="main"></div>
  <div class="foot">
    <div class="msg muted">Also in the Guide tab of your AscensionDex (/ascend dex).</div>
    <button id="done">Close</button>
  </div>
</div>
<script src="ui.js"></script>
<script src="guide-data.js"></script>
<script src="guide-panel.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  A.guide.mount($('main'));
  $('close').addEventListener('click', function () { A.send('close'); });
  $('done').addEventListener('click', function () { A.send('close'); });
})();
</script>
</body>
</html>
