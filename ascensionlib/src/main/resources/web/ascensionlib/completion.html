<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower completion</title>
<link rel="stylesheet" href="ascension.css">
<style>
  .frame { width: 720px; height: 560px; }
  .main { flex: 1; min-height: 0; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .banner { text-align: center; padding: 14px 8px; border: 2px solid var(--tier, var(--line)); background: var(--tierbg, var(--row)); color: var(--tier, var(--acc));
            font-size: 24px; letter-spacing: .18em; text-shadow: 0 0 10px var(--tier, var(--acc)); opacity: 0; transform: scale(.92); transition: opacity .5s, transform .5s; }
  .banner.on { opacity: 1; transform: scale(1); }
  .sub { text-align: center; color: var(--muted); font-size: 11px; min-height: 16px; }
  .pile { display: grid; gap: 5px; }
  .pl { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 5px 8px; background: var(--row); border: 2px solid var(--line);
        opacity: 0; transform: translateX(-12px); transition: opacity .25s, transform .25s; }
  .pl.on { opacity: 1; transform: none; }
  .pl img { width: 32px; height: 32px; image-rendering: pixelated; background: var(--well); border: 2px solid var(--line); padding: 2px; }
  .pl .amt { font-size: 15px; color: var(--acc); text-shadow: var(--glow); min-width: 70px; text-align: right; }
  .crownlabel { color: var(--gold); letter-spacing: .14em; text-align: center; margin-top: 4px; opacity: 0; transition: opacity .4s; }
  .crownlabel.on { opacity: 1; }
  .crowns { display: grid; gap: 8px; }
  .cr { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: center; padding: 10px; background: var(--row); border: 2px solid var(--line); min-height: 64px;
        opacity: 0; transform: scale(.9); transition: opacity .3s, transform .3s; }
  .cr.on { opacity: 1; transform: none; }
  .cr.big { border-color: var(--gold); box-shadow: 0 0 0 2px var(--outline), 0 0 14px rgba(242, 207, 58, .55); animation: pulse 1s steps(2) 3; }
  .cr img { width: 64px; height: 64px; image-rendering: pixelated; background: var(--well); border: 2px solid var(--line); padding: 3px; }
  .cr .ph { width: 64px; height: 64px; background: var(--well); border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 22px; }
  .cr .nm { font-size: 15px; text-shadow: var(--glow); } .cr .hint { color: var(--muted); font-size: 10px; }
  .cr.spin .nm { color: var(--muted); }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .meter { display: flex; gap: 3px; justify-content: center; align-items: flex-end; margin-top: 2px; }
  .meter .tier { flex: 1; max-width: 120px; text-align: center; font-size: 10px; color: var(--muted); }
  .meter .tier .b { height: 8px; background: var(--well); border: 2px solid var(--line); margin-bottom: 3px; } .meter .tier.on .b { background: var(--tier, var(--acc)); }
  .meter .tier.on { color: var(--ink); }
  .report { color: var(--muted); font-size: 11px; text-align: center; opacity: 0; transition: opacity .5s; }
  .report.on { opacity: 1; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>TOWER COMPLETION</span><button class="x" id="close" title="Close">X</button></div>
  <div class="main">
    <div class="banner" id="banner"></div>
    <div class="sub" id="sub"></div>
    <div class="meter" id="meter"></div>
    <div class="pile" id="pile"></div>
    <div class="crownlabel" id="crownlabel">THE CROWN</div>
    <div class="crowns" id="crowns"></div>
    <div class="report" id="report"></div>
  </div>
  <div class="foot">
    <div class="msg muted" id="msg"></div>
    <button id="share">Share</button>
    <button id="skip">Replay</button>
    <button class="primary" id="done">Collect</button>
  </div>
</div>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var A = window.A, $ = A.$;
  var view = null, timers = [], ctx = null, step = 0;
  var TIER = { bronze: ['#cd8a4b', '#2b1a0d', 'common'], silver: ['#cfd6e4', '#1c2330', 'rare'], gold: ['#ffd437', '#2b2308', 'legendary'], mythic: ['#ff3448', '#2e0710', 'mythical'] };

  // A tick that rises in pitch per line, and a bigger chord for a headline item. Sound is a bonus: any failure is ignored.
  function tone(freq, ms, type, gain) {
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'square'; o.frequency.value = freq; g.gain.value = gain || 0.04;
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + ms / 1000);
    } catch (e) { /* no audio */ }
  }
  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function countUp(el, to) {
    var start = Date.now(), dur = Math.min(900, 200 + to * 0.6);
    (function frame() {
      var t = Math.min(1, (Date.now() - start) / dur);
      A.text(el, '+' + A.num(Math.round(to * t)));
      if (t < 1) timers.push(setTimeout(frame, 40));
    })();
  }

  function play() {
    if (!view) return;
    var t = TIER[view.tier] || TIER.silver;
    var root = document.documentElement.style;
    root.setProperty('--tier', t[0]); root.setProperty('--tierbg', t[1]);
    A.setBezel(t[2]);
    $('pile').innerHTML = ''; $('crowns').innerHTML = ''; step = 0;
    $('crownlabel').className = 'crownlabel'; $('report').className = 'report'; $('banner').className = 'banner';
    A.text($('banner'), view.tierName + ' COMPLETION');
    var kind = view.flawless ? 'flawless' : 'not flawless';
    A.text($('sub'), 'Score ' + view.score + ' · ' + view.cards + ' challenge card' + (view.cards === 1 ? '' : 's') + ' · cycle ' + view.cycle + ' · ' + kind);
    A.text($('msg'), view.preview ? 'Preview only: nothing was paid.' : '');
    // The score meter: one segment per tier, lit up to the tier this run reached, so the next one to chase is plain.
    var meter = $('meter'); meter.innerHTML = '';
    (view.tiers || []).forEach(function (t) {
      var seg = A.el('div', 'tier' + (view.score >= t.from ? ' on' : ''));
      seg.appendChild(A.el('div', 'b')); seg.appendChild(A.el('div', '', t.name + ' ' + t.from + '+'));
      meter.appendChild(seg);
    });
    $('share').disabled = !!view.preview;
    later(150, function () { $('banner').className = 'banner on'; tone(220, 300, 'sawtooth', 0.05); });
    var at = 900;
    view.pile.forEach(function (l, i) {
      later(at + i * 450, function () {
        var row = A.el('div', 'pl');
        var img = new Image(); img.alt = ''; img.src = 'icons/' + l.id + '.png'; row.appendChild(img);
        var nm = A.el('div', '', l.name); nm.style.color = l.color; row.appendChild(nm);
        var amt = A.el('div', 'amt', '+0'); row.appendChild(amt);
        $('pile').appendChild(row);
        setTimeout(function () { row.className = 'pl on'; }, 20);
        countUp(amt, l.amount);
        tone(330 + i * 70, 90);
      });
    });
    at += view.pile.length * 450 + 500;
    later(at, function () { $('crownlabel').className = 'crownlabel on'; tone(440, 160, 'triangle'); });
    at += 700;
    view.crowns.forEach(function (c, i) {
      var row = A.el('div', 'cr spin');
      var ph = A.el('div', 'ph', '?'); row.appendChild(ph);
      var box = A.el('div'); box.appendChild(A.el('div', 'nm', 'Rolling…')); row.appendChild(box);
      later(at + i * 1900, function () {
        $('crowns').appendChild(row);
        setTimeout(function () { row.className = 'cr spin on'; }, 20);
        tone(280, 120, 'square', 0.03);
      });
      later(at + i * 1900 + 1000, function () {
        row.className = 'cr on' + (c.big ? ' big' : '');
        row.innerHTML = '';
        if (c.id) { var img = new Image(); img.alt = ''; img.src = 'icons/' + c.id + '.png'; row.appendChild(img); }
        else row.appendChild(A.el('div', 'ph', '★'));
        var box2 = A.el('div'); var nm = A.el('div', 'nm', c.label + (c.amount > 1 ? ' x' + c.amount : '')); nm.style.color = c.color; box2.appendChild(nm);
        box2.appendChild(A.el('div', 'hint', c.id ? (c.big ? 'Headline item' : 'Added to your wallet') : 'Handed over by the Tower'));
        row.appendChild(box2);
        if (c.big) { tone(523, 200, 'triangle', 0.06); setTimeout(function () { tone(659, 200, 'triangle', 0.06); }, 150); setTimeout(function () { tone(784, 320, 'triangle', 0.06); }, 300); }
        else tone(466, 160, 'triangle', 0.05);
      });
    });
    at += view.crowns.length * 1900 + 400;
    later(at, function () {
      A.text($('report'), '+' + view.attunement + ' attunement to your party · everything is in your wallet (/ascend wallet gui)');
      $('report').className = 'report on';
    });
  }

  function finish() { timers.forEach(clearTimeout); timers = []; A.send('ascension_screen_release'); A.send('close'); }
  $('close').addEventListener('click', finish);
  $('done').addEventListener('click', finish);
  $('share').addEventListener('click', function () { if (view && !view.preview && !$('share').disabled) { $('share').disabled = true; A.send('ascension_completion_share'); A.text($('msg'), 'Shared in chat.'); } });
  $('skip').addEventListener('click', function () { timers.forEach(clearTimeout); timers = []; play(); });

  A.on('completionView', function (v) { view = v; play(); });

  function ready() {
    A.ready('ascension_completion_ready', function () { return !!view; }, $('msg'));
  }
  ready();
  // Tell the server this page is still up (Esc sends nothing), so another mod does not open its own screen over the reveal.
  if (A.g) setInterval(function () { A.send('ascension_screen_ping'); }, 1500);
})();
</script>
</body>
</html>
