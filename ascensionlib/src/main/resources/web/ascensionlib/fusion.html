<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion</title>
<link rel="stylesheet" href="ascension.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 210px 1fr 210px; gap: 12px; padding: 12px 14px; }
  .well { background: radial-gradient(circle at 50% 70%, #11405a, #07131c 72%); height: 130px; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px; }
  .sprbox { display: flex; align-items: center; justify-content: center; }
  .name { margin-top: 8px; overflow-wrap: anywhere; text-shadow: var(--glow); }
  .rarity { text-transform: capitalize; }
  .result { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .result p { margin: 0 0 6px; overflow-wrap: anywhere; }
  .result h2 { margin: 0 0 6px; font-size: 15px; font-weight: 400; color: var(--acc); text-shadow: var(--glow); }
  /* picker */
  .picker { width: min(600px, 96vw); max-height: 92vh; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--acc); box-shadow: var(--glow); }
  .picker .head { letter-spacing: .06em; }
  .picker .tools { display: flex; gap: 6px; padding: 8px 12px 0; }
  .picker input { flex: 1; padding: 6px 8px; border: 2px solid var(--line); background: var(--head); font: inherit; color: var(--ink); }
  .tabs { display: flex; gap: 6px; padding: 8px 12px 0; }
  .tabs button.on { background: var(--crimson); color: #fff; border-color: #eef2f7; text-shadow: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 10px 12px; overflow-y: auto; min-height: 150px; }
  .tile { background: var(--row); border: 2px solid var(--line); border-top: 5px solid var(--line); padding: 6px; cursor: pointer; text-align: center; min-height: 84px; }
  .tile:hover:not(.off) { border-color: var(--acc); box-shadow: var(--glow); }
  .tile.off { background: var(--head); color: var(--muted); cursor: not-allowed; opacity: .6; }
  .tile .n { font-size: 12px; overflow-wrap: anywhere; } .tile .r { font-size: 10px; text-transform: capitalize; }
  .spr { image-rendering: pixelated; }
  .empty { padding: 12px; color: var(--muted); }
  .reason { padding: 6px 12px; min-height: 28px; color: var(--warn); font-size: 11px; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span>FUSION</span><button class="x" id="close" title="Close">X</button></div>
  <div class="main">
    <div class="box" id="hostBox">
      <div class="label">Host (kept)</div>
      <div class="well" id="hostWell"></div>
      <div class="name" id="hostName"></div>
      <div class="rarity" id="hostRarity"></div>
      <div class="muted" id="hostUnique"></div>
      <div class="spacer"></div>
      <button id="changeHost">Change host</button>
    </div>
    <div class="box">
      <div class="label">Result</div>
      <div class="result" id="result"></div>
      <div style="text-align:center;margin-top:8px"><button id="swap" title="Swap host and donor">&#8596; Swap</button></div>
    </div>
    <div class="box" id="donorBox">
      <div class="label">Donor (consumed)</div>
      <div class="well" id="donorWell"></div>
      <div class="name" id="donorName"></div>
      <div class="rarity" id="donorRarity"></div>
      <div class="muted" id="donorUnique"></div>
      <div class="spacer"></div>
      <button id="changeDonor">Choose donor</button>
    </div>
  </div>
  <div class="foot">
    <div class="msg" id="msg"></div>
    <button class="primary" id="fuse" disabled>Review fusion</button>
    <button id="cancel">Close</button>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="picker">
    <div class="head"><span id="pickTitle"></span><button class="x" id="pickClose">&times;</button></div>
    <div class="tabs"><button id="tabParty" class="on">Party</button><button id="tabPc">PC (first page)</button><button id="sort">Sort: Rarity</button></div>
    <div class="tools"><input id="search" placeholder="Search name, species or Unique" maxlength="40" autocomplete="off"></div>
    <div class="grid" id="grid"></div>
    <div class="reason" id="reason"></div>
  </div>
</div>

<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var g = window.webgui;
  var $ = function (id) { return document.getElementById(id); };
  var RARITY = { common: '--common', uncommon: '--uncommon', rare: '--rare', epic: '--epic', legendary: '--legendary', mythical: '--mythical' };
  var host = null, hostBlock = '', donor = null, detail = null;
  var phase = 'browse';          // browse | review | waiting
  var pendingOp = '', banner = '', bannerOk = false, previewTimer = 0, waitTimer = 0, readyTries = 0;
  var pick = { role: 'donor', entries: null, pc: false, sort: 'rarity', search: '' };

  function send(channel, body) {
    if (!g) return;
    var o = body || {}; o.channel = channel;
    g.postToGame(o);
  }
  function parse(data) { return typeof data === 'string' ? JSON.parse(data) : data; }
  function text(el, value) { el.textContent = value == null ? '' : String(value); }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ''; }
  function colorOf(r) { return RARITY[r] ? 'var(' + RARITY[r] + ')' : 'var(--edge)'; }
  function nice(species) { var i = species.indexOf(':'); return (i >= 0 ? species.slice(i + 1) : species).replace(/_/g, ' '); }

  function chamber(prefix, e) {
    var well = $(prefix + 'Well');
    well.innerHTML = '';
    well.style.borderColor = e ? colorOf(e.rarityId) : 'var(--line)'; if (prefix === 'host') window.A.setBezel(e ? e.rarityId : '');
    if (!e) { var s = document.createElement('div'); s.className = 'muted'; s.textContent = 'empty'; well.appendChild(s); }
    else { well.appendChild(window.A.sprite(e.speciesId, 2)); }
    text($(prefix + 'Name'), e ? e.name : '');
    var r = $(prefix + 'Rarity'); text(r, e ? e.rarityId : ''); r.style.color = e && e.rarityId ? colorOf(e.rarityId) : '';
    text($(prefix + 'Unique'), e ? e.uniqueName : '');
  }

  function line(parent, cls, value) { var p = document.createElement('p'); if (cls) p.className = cls; p.textContent = value; parent.appendChild(p); return p; }

  function renderResult() {
    var box = $('result'); box.innerHTML = '';
    if (hostBlock) { line(box, 'bad', hostBlock + ' Choose a different host.'); return; }
    if (!donor) { line(box, 'muted', 'Choose a donor: Epic or better, with a Unique, and not a Transcendent.'); return; }
    if (phase !== 'browse') {
      line(box, '', 'Fuse ' + donor.name + ' into ' + host.name + '? ' + donor.name + ' is consumed and cannot be recovered. ' + host.name +
        ' keeps its own modifiers and becomes ' + (detail ? detail.name : 'a Transcendent') + ', once, for good.');
      if (phase === 'waiting') line(box, 'muted', 'Waiting for the server…');
      return;
    }
    if (!detail) { line(box, 'muted', 'Reading the pairing…'); return; }
    if (!detail.name) { line(box, 'bad', detail.block); return; }
    var h = document.createElement('h2'); h.textContent = detail.name; box.appendChild(h);
    line(box, '', 'Fused from: ' + detail.fromUniques);
    line(box, 'muted', cap(detail.harmony) + ' harmony: ' + detail.benefit + '% of the benefits, ' + detail.drawback + '% of the drawbacks');
    if (detail.blurb) line(box, 'muted', detail.blurb);
    line(box, '', 'Core: ' + detail.core);
    line(box, '', 'Clutch: ' + detail.clutch);
    line(box, 'bad', 'Drawback: ' + detail.drawbackText);
    line(box, '', 'Twist, ' + detail.twistName + ': ' + detail.twistText);
    line(box, '', 'Rider: ' + detail.riderText);
    var types = [];
    if (detail.hostType) types.push('+10% ' + cap(detail.hostType) + ' moves');
    if (detail.donorType) types.push('-10% damage from ' + cap(detail.donorType) + ' moves');
    if (types.length) line(box, '', 'Types: ' + types.join('; '));
    var p = detail.price, b = detail.balances;
    line(box, 'gold', 'Price: ' + p[0] + ' Resonance Dust, ' + p[1] + ' Facets, ' + p[2] + ' Cores, ' + p[3] + ' Catalyst');
    line(box, 'muted', 'You have: ' + b.join(' / '));
    if (detail.block) line(box, 'bad', detail.block);
  }

  function render() {
    chamber('host', host); chamber('donor', donor);
    $('changeDonor').textContent = donor ? 'Change donor' : 'Choose donor';
    $('changeDonor').className = donor ? '' : 'primary';
    var idle = phase === 'browse';
    $('changeHost').disabled = !idle || !host;
    $('changeDonor').disabled = !idle || !host;
    $('swap').disabled = !(idle && donor && donor.canHost && !hostBlock);
    $('swap').title = $('swap').disabled && donor ? 'Only a Mythic with a Unique and no fusion can trade places with the host.' : 'Swap host and donor';
    var fuse = $('fuse');
    fuse.textContent = phase === 'review' ? 'Fuse for good' : 'Review fusion';
    fuse.disabled = phase === 'waiting' || (phase === 'browse' && !(detail && !detail.block && detail.name));
    $('cancel').textContent = idle ? 'Close' : 'Cancel';
    var m = $('msg');
    if (banner) { text(m, banner); m.className = 'msg ' + (bannerOk ? 'ok' : 'bad'); }
    else { text(m, donor ? 'The donor is lost for good.' : ''); m.className = 'msg muted'; }
    renderResult();
  }

  function askPreview() {
    detail = null; phase = 'browse';
    clearTimeout(previewTimer);
    if (donor && host && !hostBlock) {
      send('ascension_fusion_preview', { hostId: host.id, donorId: donor.id });
      previewTimer = setTimeout(function () {
        if (!detail && donor) { banner = 'No answer from the server. Choose the donor again.'; bannerOk = false; donor = null; render(); }
      }, 8000);
    }
    render();
  }

  // ---- picker ----
  function openPicker(role) {
    if (phase !== 'browse' || !host) return;
    pick.role = role; pick.entries = null; pick.pc = false; pick.search = ''; $('search').value = '';
    $('pickTitle').textContent = role === 'host' ? 'Choose the host (kept): Mythic with a Unique' : 'Choose the donor (consumed)';
    $('tabParty').className = 'on'; $('tabPc').className = '';
    $('scrim').className = 'scrim on';
    drawPicker();
    send('ascension_fusion_pick', { hostRole: role === 'host', hostId: host.id, donorId: donor ? donor.id : '' });
  }
  function closePicker() { $('scrim').className = 'scrim'; }
  function drawPicker() {
    var grid = $('grid'); grid.innerHTML = ''; text($('reason'), '');
    if (!pick.entries) { var d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Reading your Pokémon…'; grid.appendChild(d); return; }
    var needle = pick.search.toLowerCase().trim();
    var list = pick.entries.filter(function (e) {
      if (e.inParty === pick.pc) return false;
      return !needle || e.name.toLowerCase().indexOf(needle) >= 0 || e.speciesId.toLowerCase().indexOf(needle) >= 0 || e.uniqueName.toLowerCase().indexOf(needle) >= 0;
    });
    var order = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythical'];
    list.sort(function (a, b) {
      var ua = a.block ? 1 : 0, ub = b.block ? 1 : 0;
      if (ua !== ub) return ua - ub;
      if (pick.sort === 'rarity') { var d = order.indexOf(b.rarityId) - order.indexOf(a.rarityId); if (d) return d; }
      return a.name.localeCompare(b.name);
    });
    if (!list.length) {
      var e0 = document.createElement('div'); e0.className = 'empty';
      e0.textContent = pick.role === 'host' ? 'No Pokémon here can be the host: it must be a Mythic with a Unique and not a Transcendent.'
        : pick.pc ? 'Nothing in the first page of your PC matches.' : 'Nothing in your party matches.';
      grid.appendChild(e0); return;
    }
    list.forEach(function (e) {
      var t = document.createElement('div');
      t.className = 'tile' + (e.block ? ' off' : '');
      t.style.borderTopColor = colorOf(e.rarityId);
      var n = document.createElement('div'); n.className = 'n'; n.textContent = e.name; t.appendChild(n);
      var sp = window.A.sprite(e.speciesId, 1); sp.style.margin = '2px auto'; t.insertBefore(sp, n);
      var r = document.createElement('div'); r.className = 'r'; r.textContent = e.rarityId || 'no profile'; r.style.color = e.rarityId ? colorOf(e.rarityId) : ''; t.appendChild(r);
      t.addEventListener('mouseenter', function () {
        text($('reason'), e.block || (e.uniqueName ? e.name + ' · ' + e.uniqueName : e.name));
        $('reason').style.color = e.block ? 'var(--crimson)' : 'var(--muted)';
      });
      t.addEventListener('click', function () {
        if (e.block) return;
        if (pick.role === 'host') { host = e; hostBlock = ''; } else { donor = e; }
        banner = ''; closePicker(); askPreview();
      });
      grid.appendChild(t);
    });
  }

  // ---- events from the server ----
  if (g) {
    g.on('fusionCandidates', function (data) {
      var c = parse(data); readyTries = 99;
      host = c.host; hostBlock = c.hostBlock || '';
      if (phase === 'browse') { if (donor && donor.id === host.id) donor = null; askPreview(); } else render();
    });
    g.on('fusionPickList', function (data) {
      var l = parse(data);
      if ((l.hostRole ? 'host' : 'donor') !== pick.role) return;
      pick.entries = l.entries || []; drawPicker();
    });
    g.on('fusionDetail', function (data) {
      var d = parse(data);
      if (!donor || !host || d.hostId !== host.id || d.donorId !== donor.id) return;
      clearTimeout(previewTimer); detail = d; render();
    });
    g.on('fusionResult', function (data) {
      var r = parse(data);
      if (r.operationId !== pendingOp) return;
      clearTimeout(waitTimer); pendingOp = ''; phase = 'browse'; bannerOk = !!r.ok;
      if (r.ok) {
        banner = host.name + ' became ' + r.name + '.'; donor = null; detail = null;
        send('ascension_fusion_refresh', { hostId: host.id });
      } else { banner = r.message || 'Not allowed.'; }
      render();
    });
  }

  // ---- buttons ----
  $('close').addEventListener('click', function () { send('close'); });
  $('cancel').addEventListener('click', function () { if (phase === 'browse') send('close'); else { phase = 'browse'; render(); } });
  $('changeHost').addEventListener('click', function () { openPicker('host'); });
  $('changeDonor').addEventListener('click', function () { openPicker('donor'); });
  $('pickClose').addEventListener('click', closePicker);
  $('scrim').addEventListener('click', function (ev) { if (ev.target === $('scrim')) closePicker(); });
  $('tabParty').addEventListener('click', function () { pick.pc = false; $('tabParty').className = 'on'; $('tabPc').className = ''; drawPicker(); });
  $('tabPc').addEventListener('click', function () { pick.pc = true; $('tabPc').className = 'on'; $('tabParty').className = ''; drawPicker(); });
  $('sort').addEventListener('click', function () { pick.sort = pick.sort === 'rarity' ? 'name' : 'rarity'; text($('sort'), 'Sort: ' + (pick.sort === 'rarity' ? 'Rarity' : 'Name')); drawPicker(); });
  $('search').addEventListener('input', function (ev) { pick.search = ev.target.value; drawPicker(); });
  $('swap').addEventListener('click', function () {
    if ($('swap').disabled) return;
    var old = host; host = donor; hostBlock = ''; donor = old; banner = ''; askPreview();
  });
  $('fuse').addEventListener('click', function () {
    if (phase === 'browse') { phase = 'review'; render(); return; }
    if (phase !== 'review' || !detail || detail.block || !donor) return;
    pendingOp = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
    phase = 'waiting'; render();
    send('ascension_fusion_confirm', { operationId: pendingOp, hostId: host.id, donorId: donor.id,
      hostRevision: detail.hostRevision, donorRevision: detail.donorRevision, walletRevision: detail.walletRevision });
    waitTimer = setTimeout(function () {
      if (phase === 'waiting') { phase = 'browse'; pendingOp = ''; banner = 'No answer from the server. Nothing was spent unless it shows in your wallet.'; bannerOk = false; render(); }
    }, 15000);
  });

  // ---- start ----
  function ready() {
    if (!g) { text($('msg'), 'This page needs the WebGUI mod.'); return; }
    send('ascension_fusion_ready');
    if (++readyTries < 4) setTimeout(function () { if (!host) ready(); }, 2000);
  }
  render();
  ready();
})();
</script>
</body>
</html>
