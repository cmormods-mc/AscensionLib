<div class="aw-tools"><label>Preview <select id="aw-scenario"><option value="pending">2 upgrades available</option><option value="empty">No upgrades left</option><option value="max">Rank V affix</option></select></label><label><input type="checkbox" id="aw-sound"> Sound</label></div>
<section class="aw-game" aria-label="Affix workshop">
 <header class="aw-title"><h2>Affix upgrades</h2><p>Choose where Growlithe grows stronger.</p></header>
 <div class="aw-window">
  <div class="aw-header"><div class="aw-sprite"><img alt="Cobblemon Cards Growlithe sprite" width="144" height="96" src="https://cdn.jsdelivr.net/gh/Howlite-UI/CobblemonCards@c02aafb50d5915b83dafa9af28ddebd58be24b5e/common/src/main/resources/assets/cobblemon-cards/textures/item/cards/pokemon/entity_icon/0058_growlithe/growlithe.png"></div><div><div class="aw-name">Growlithe</div><div class="aw-meta"><span class="aw-level">Lv. 28</span><span class="aw-mythic">MYTHIC</span></div></div><div class="aw-credit"><strong>2</strong><span>upgrades available</span></div></div>
  <div class="aw-tabs" role="group" aria-label="Crafting mode"><button type="button" data-mode="upgrade" aria-pressed="true">Upgrade</button><button type="button" data-mode="reforge" aria-pressed="false">Reforge</button><span class="aw-wallet" hidden></span></div>

 <p class="aw-caption" role="status" aria-live="polite">Choose an affix. Nothing is spent until you confirm.</p>
</section>
<script>
(()=>{
 const root=document.getElementById('ca-affix-workshop'),q=s=>root.querySelector(s),roman=['I','II','III','IV','V'];
 const defs={fire:{name:'Fire Focus',type:'prefix',sign:'+',bands:[[4,8],[9,12],[13,16],[17,20],[21,24]],text:'More direct damage from Fire-type moves.'},physical:{name:'Physical Force',type:'prefix',sign:'+',bands:[[3,6],[7,9],[10,12],[13,15],[16,18]],text:'More direct damage from physical moves.'},healthy:{name:'Healthy Force',type:'prefix',sign:'+',bands:[[3,6],[7,10],[11,14],[15,18],[19,22]],text:'More direct damage while at or above 80% HP when a move begins.'},guard:{name:'Opening Guard',type:'suffix',sign:'−',bands:[[5,10],[11,13],[14,16],[17,19],[20,22]],text:'Less direct damage from the first damaging move that connects each battle.'},water:{name:'Water Ward',type:'suffix',sign:'−',bands:[[3,6],[7,9],[10,12],[13,15],[16,18]],text:'Less direct damage from Water-type moves.'},restore:{name:'Restorative',type:'suffix',sign:'+',bands:[[5,15],[16,19],[20,23],[24,27],[28,31]],text:'More HP restored by self-recovery and drain moves.'},special:{name:'Special Force',type:'prefix',sign:'+',bands:[[3,6],[7,9],[10,12],[13,15],[16,18]],text:'More direct damage from special moves.'},burn:{name:'Smoldering',type:'prefix',sign:'+',bands:[[4,8],[9,12],[13,16],[17,20],[21,24]],text:'More burn damage for supported burns you inflicted while active.'},last:{name:'Finisher',type:'prefix',sign:'+',bands:[[3,6],[7,10],[11,14],[15,18],[19,22]],text:'More direct damage against targets below 30% HP.'},fireward:{name:'Fire Ward',type:'suffix',sign:'−',bands:[[3,6],[7,9],[10,12],[13,15],[16,18]],text:'Less direct damage from Fire-type moves.'},relay:{name:'Relay Guard',type:'suffix',sign:'−',bands:[[3,6],[7,9],[10,12],[13,15],[16,18]],text:'Less direct damage from the next hit after switching in; once per battle.'}};
 let slots,credits,level,dust,facets,selected=0,mode='upgrade',step='select',scenario='pending',result=null,ctx,voices=[];
 const sign=(id,n)=>defs[id].sign+n+'%',band=(id,r)=>defs[id].bands[r].join('–')+'%';
 function reset(){slots=['fire','physical','healthy','guard','water','restore'].map((id,i)=>({slot:i,id,rank:0,value:[7,4,6,8,5,12][i]}));credits=2;level=28;dust=40;facets=2;if(scenario==='empty'){credits=0;slots[0].rank=1;slots[0].value=10;slots[1].rank=1;slots[1].value=8}if(scenario==='max'){level=68;slots[0].rank=4;slots[0].value=23}selected=0;mode='upgrade';step='select';result=null;q('.aw-window').hidden=false;q('.aw-done').hidden=true;render()}
 function tone(){if(!q('#aw-sound').checked)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume().then(()=>{const t=ctx.currentTime;[392,523.25].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.065);g.gain.exponentialRampToValueAtTime(.045,t+i*.065+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.065+.2);o.connect(g);g.connect(ctx.destination);o.start(t+i*.065);o.stop(t+i*.065+.23);voices.push(o);o.onended=()=>{o.disconnect();g.disconnect();voices=voices.filter(v=>v!==o)}})}).catch(()=>{})}catch{}}
 function pool(){const s=slots[selected];return Object.keys(defs).filter(id=>defs[id].type===defs[s.id].type&&!slots.some(slot=>slot.id===id))}
 function can(){return mode==='upgrade'?credits>0&&slots[selected].rank<4:dust>=10&&facets>=1&&pool().length>0}
 function render(){const s=slots[selected],d=defs[s.id];q('.aw-level').textContent='Lv. '+level;q('.aw-credit strong').textContent=credits;q('.aw-credit span').textContent=credits===1?'upgrade available':'upgrades available';q('.aw-next').textContent='Next upgrade at Lv. '+(Math.floor(level/10)+1)*10;q('.aw-wallet').hidden=mode!=='reforge';q('.aw-wallet').textContent=dust+' Dust · '+facets+' Facets';root.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.disabled=step==='confirm'});q('.aw-later').disabled=step==='confirm';
 const list=q('.aw-list');list.replaceChildren();slots.forEach((slot,i)=>{const a=defs[slot.id],b=document.createElement('button');b.type='button';b.className='aw-row';b.dataset.slot=i;b.disabled=step==='confirm';b.setAttribute('aria-pressed',String(i===selected));b.innerHTML='<span class="aw-mark '+a.type+'" aria-hidden="true"></span><span><span class="aw-row-name">'+a.name+'</span><span class="aw-row-rank">'+a.type+' · '+roman[slot.rank]+(slot.rank===4?' · MAX':'')+'</span></span><span class="aw-row-value">'+sign(slot.id,slot.value)+'</span>';b.addEventListener('click',()=>{selected=i;step='select';result=null;render()});list.append(b)});
 const detail=q('.aw-detail');detail.innerHTML='<div class="aw-eyebrow">'+(mode==='upgrade'?'Upgrade '+d.type:'Reforge '+d.type)+'</div><h3>'+d.name+'</h3><p class="aw-description">'+d.text+'</p>';
 if(step==='result'){const box=document.createElement('div');box.className='aw-feedback aw-result-anim';box.innerHTML=(mode==='upgrade'?'Affix upgraded':'Affix reforged')+'<strong>'+d.name+' '+sign(s.id,s.value)+'</strong>Rank '+roman[s.rank]+' · '+(mode==='upgrade'?'1 upgrade used': '10 Dust + 1 Facet used');detail.append(box)}
 if(mode==='upgrade'){detail.insertAdjacentHTML('beforeend','<div class="aw-compare"><div class="aw-band"><small>Current · '+roman[s.rank]+'</small><strong>'+sign(s.id,s.value)+'</strong><span>Range '+band(s.id,s.rank)+'</span></div><div class="aw-arrow" aria-hidden="true">→</div><div class="aw-band next"><small>'+(s.rank===4?'Maximum rank':'Next · '+roman[s.rank+1])+'</small><strong>'+(s.rank===4?'V':band(s.id,s.rank+1))+'</strong><span>'+(s.rank===4?'Fully upgraded':'New roll range')+'</span></div></div><div class="aw-pips" aria-hidden="true">'+roman.map((_,i)=>'<span class="aw-pip '+(i<=s.rank?'filled':i===s.rank+1?'target':'')+'"></span>').join('')+'</div><p class="aw-rule">'+(s.rank===4?'This slot has reached rank V. Choose another affix, or keep your upgrades for later.':'Keeps this affix. Rolls in the next range.<br>No failure chance. Stronger raw bonus.')+'</p>');if(credits===0)detail.insertAdjacentHTML('beforeend','<p class="aw-alert">No upgrades left. The next is earned at level '+(Math.floor(level/10)+1)*10+'.</p>')}
 else{detail.insertAdjacentHTML('beforeend','<p class="aw-pool-label">Eligible replacements · rank '+roman[s.rank]+'</p><ul class="aw-pool">'+pool().map(id=>'<li>'+defs[id].name+'<span>'+band(id,s.rank)+'</span></li>').join('')+'</ul><p class="aw-rule">Random replacement. Rank '+roman[s.rank]+' stays.<br>Pending upgrades are unchanged.</p>');if(!can())detail.insertAdjacentHTML('beforeend','<p class="aw-alert">Not enough crafting materials.</p>')}
 if(step==='confirm'){detail.insertAdjacentHTML('beforeend','<div class="aw-confirm-note">'+(mode==='upgrade'?'Spend 1 upgrade on '+d.name+'?<br>'+sign(s.id,s.value)+' → rank '+roman[s.rank+1]+', '+band(s.id,s.rank+1)+'.':'Replace '+d.name+'?<br>This spends 10 Dust and 1 Facet. The old affix is removed.')+'</div><div class="aw-confirm-actions"><button class="aw-button secondary aw-cancel" type="button">Cancel</button><button class="aw-button aw-confirm" type="button">Confirm '+(mode==='upgrade'?'upgrade':'reforge')+'</button></div>');q('.aw-cancel').onclick=()=>{step='select';render();q('.aw-review').focus()};q('.aw-confirm').onclick=commit}
 else{detail.insertAdjacentHTML('beforeend','<div class="aw-cost"><span>Cost</span><strong>'+(mode==='upgrade'?'1 pending upgrade':'10 Dust + 1 Facet')+'</strong></div><button class="aw-button aw-review" type="button" '+(!can()?'disabled':'')+'>'+(s.rank===4&&mode==='upgrade'?'Maximum rank':mode==='upgrade'?'Review upgrade':'Review reforge')+'</button>');q('.aw-review').onclick=()=>{if(!can())return;step='confirm';render();q('.aw-confirm').focus()}}
 q('.aw-caption').textContent=step==='confirm'?'Review your choice. Cancel costs nothing.':step==='result'?(mode==='upgrade'?'Upgrade complete. '+credits+' remaining.':'Reforge complete. Slot rank and pending upgrades retained.'):'Preview values and costs · Final balance pending.';
 }
 function commit(){if(step!=='confirm'||!can())return;const s=slots[selected];if(mode==='upgrade'){s.rank++;credits--}else{const eligible=pool();s.id=eligible[Math.floor(Math.random()*eligible.length)];dust-=10;facets--}const [min,max]=defs[s.id].bands[s.rank];s.value=min+Math.floor(Math.random()*(max-min+1));step='result';render();tone();const focus=q('.aw-review');if(!focus.disabled)focus.focus();else q('.aw-later').focus()}
