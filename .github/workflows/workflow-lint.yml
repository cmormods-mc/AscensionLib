name: Validate workflows

# Checks the workflow files themselves, so a broken CI definition is caught before it silently stops running.
on:
  push:
    branches: [main]
    paths:
      - '.github/**'
  pull_request:
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned release of rhysd/actionlint: syntax, expressions, action inputs, shell scripts and permissions.
      - name: Lint the workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s -- 1.7.7
          ./actionlint -color
