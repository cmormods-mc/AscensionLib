name: Build

# Every push to main and every pull request: compile, run all unit tests, check the catalog and the built jar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # The mod compiles against WebGUI (MIT, github.com/mc-webgui/webgui), which is not committed: fetch the release and make the local dev copy.
      - name: Fetch WebGUI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 -R mc-webgui/webgui -p 'webgui-fabric-2.0.0+mc1.21.1.jar' -D ascensionlib/libs
          python3 tools/prepare_webgui_dev_jar.py

      # The mod also compiles against Polymer's resource-pack API (not committed): two small jars from the Nucleoid Maven.
      - name: Fetch Polymer
        run: |
          base=https://maven.nucleoid.xyz/eu/pb4
          for artifact in polymer-resource-pack polymer-common; do
            curl -fsSL -o "ascensionlib/libs/$artifact-0.9.19+1.21.1.jar" "$base/$artifact/0.9.19%2B1.21.1/$artifact-0.9.19%2B1.21.1.jar"
          done

      # domain and store are plain Java; ascensionlib is the Fabric mod, built against Cobblemon from the Modrinth Maven.
      - name: Compile and test
        run: ./gradlew --no-daemon :domain:test :store:test :ascensionlib:build --stacktrace --warning-mode all

      # Fails on an invalid catalog: affix bands, weights, promotion chain, channel caps, example profile.
      - name: Validate the design catalog
        run: python3 tools/analyze_balance.py

      # The guide and the wiki handoff are generated from design/guide.json and the code: a rule changed without rebuilding them fails here.
      - name: Check the generated guide
        run: python3 tools/build_guide.py --check

      # The pack textures, models and icons are generated from tools/pixel_art.py and design/currency-items.json: they must be committed in step.
      - name: Check the resource pack is up to date
        run: |
          python3 tools/build_resourcepack.py
          git diff --exit-code -- resourcepack ascensionlib/src/main/resources/web/ascensionlib/icons ascensionlib/src/main/resources/data

      # The jar must nest domain, store and the SQLite driver, with the bundled catalog equal to design/.
      - name: Verify the built jar
        run: python3 tools/verify_artifact.py

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: AscensionLib-jar
          path: ascensionlib/build/libs/AscensionLib-*.jar
          if-no-files-found: error
          retention-days: 14
