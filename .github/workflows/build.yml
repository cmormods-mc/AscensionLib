name: Build

# Every push to main and every pull request: compile, run all unit tests, check the catalog and the built jar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # domain and store are plain Java; ascensionlib is the Fabric mod, built against Cobblemon from the Modrinth Maven.
      - name: Compile and test
        run: ./gradlew --no-daemon :domain:test :store:test :ascensionlib:build --stacktrace --warning-mode all

      # Fails on an invalid catalog: affix bands, weights, promotion chain, channel caps, example profile.
      - name: Validate the design catalog
        run: python3 tools/analyze_balance.py

      # The jar must nest domain, store and the SQLite driver, with the bundled catalog equal to design/.
      - name: Verify the built jar
        run: python3 tools/verify_artifact.py

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: AscensionLib-jar
          path: ascensionlib/build/libs/AscensionLib-*.jar
          if-no-files-found: error
          retention-days: 14
